<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{border:0;display:block;width:390px;height:844px}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
var out = [], pass = 0, fail = 0;
function log(m) { out.push(m); }
function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

setTimeout(async function () {
  var w = document.getElementById('f').contentWindow, d = w.document;
  function R(){ try{return w.eval('rulesV3');}catch(e){return null;}}
  try {
    var rv = R();
    if (!rv || !rv.cards) { fail++; log('FAIL  無法讀取 rulesV3'); throw new Error('no rules'); }
    var cardId = rv.cards.find(function(c){return c.plans && c.plans.length;}).id;
    var planId = rv.cards.find(function(c){return c.plans && c.plans.length;}).plans[0].id;
    w.openCardEditor(cardId);
    await sleep(150);

    d.querySelector('#cardEditorPlans [data-card-edit-plan]').click();
    await sleep(250);
    check('點編輯 → 單卡編輯頁關閉', d.getElementById('cardEditorOverlay').hidden === true);
    check('點編輯 → 獨立加碼活動頁開啟', d.getElementById('planEditorOverlay').hidden === false);
    var pform = d.getElementById('planEditorForm');
    check('獨立加碼活動頁帶入既有活動名稱', pform.elements.namedItem('name').value.length > 0, pform.elements.namedItem('name').value);
    check('獨立加碼活動頁帶入既有回饋率', Number(pform.elements.namedItem('rate').value) > 0, pform.elements.namedItem('rate').value);

    pform.elements.namedItem('name').value = '編輯後的活動名稱';
    pform.elements.namedItem('rate').value = '8.5';
    pform.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
    await sleep(300);
    rv = R();
    var plan = rv.cards.find(function(c){return c.id===cardId;}).plans.find(function(p){return p.id===planId;});
    check('編輯加碼活動 → 存回 rulesV3（名稱）', plan && plan.name === '編輯後的活動名稱', plan && plan.name);
    check('獨立加碼活動頁儲存後關閉', d.getElementById('planEditorOverlay').hidden === true);

    w.openCardEditor(cardId);
    await sleep(150);
    d.getElementById('cardEditorAddActivity').click();
    await sleep(250);
    check('新增加碼活動 → 單卡編輯頁關閉', d.getElementById('cardEditorOverlay').hidden === true);
    check('新增加碼活動 → 獨立加碼活動頁開啟', d.getElementById('planEditorOverlay').hidden === false);
    w.closePlanEditor();
    await sleep(120);

    w.openCardEditor(cardId);
    await sleep(150);
    check('每個加碼活動都有編輯鈕', d.querySelectorAll('#cardEditorPlans [data-card-edit-plan]').length === (R().cards.find(function(c){return c.id===cardId;}).plans || []).length, d.querySelectorAll('#cardEditorPlans [data-card-edit-plan]').length + ' 個');
    check('卡片編輯頁不再有內嵌表單', !d.getElementById('addDynamicPlanForm'));
  } catch (e) { fail++; log('EXCEPTION: ' + e.message + ' | ' + (e.stack || '').split('\n')[1]); }
  log('');
  log('=== ' + pass + ' passed, ' + fail + ' failed ===');
  var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}, 1500);
</script>
