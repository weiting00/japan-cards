<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{border:0;display:block;width:390px;height:844px}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
var out = [], pass = 0, fail = 0;
function log(m) { out.push(m); }
function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var ev = function (code) { return w.eval(code); };

setTimeout(async function () {
  var w, d, errs, confirmDialog, cardEditor, R, ev;
  try {
    w = document.getElementById('f').contentWindow; d = w.document;
    ev = function (code) { return w.eval(code); };
    errs = []; if (w.addEventListener) w.addEventListener('error', function(e){ errs.push(e.message); });
    confirmDialog = function () { var b = d.getElementById('appDialogConfirm'); if (b) { b.click(); } else { var btns = d.querySelectorAll('#appDialogModal button'); for (var i=0;i<btns.length;i++){ if(btns[i].textContent.indexOf('確認')>=0||btns[i].textContent.indexOf('刪除')>=0||btns[i].textContent.indexOf('確定')>=0){btns[i].click();break;}} } };
    cardEditor = function () { return d.getElementById('cardEditorOverlay'); };
    R = function () { return ev('rulesV3'); };

  try {
    ev('switchTab("guide")');
    await sleep(200);
    var editBtns = d.querySelectorAll('#guideCardList [data-guide-edit]');
    check('攻略頁每張卡都有編輯按鈕', editBtns.length === R().cards.length, editBtns.length + ' 個 / ' + R().cards.length + ' 張卡');
    var firstCard = R().cards[0];
    check('編輯按鈕帶 data-guide-edit=cardId', editBtns[0] && editBtns[0].dataset.guideEdit === firstCard.id, editBtns[0] && editBtns[0].dataset.guideEdit);
    check('編輯按鈕文字為「編輯」', editBtns[0] && editBtns[0].textContent.trim() === '編輯', editBtns[0] && editBtns[0].textContent.trim());

    // ---------- 2. 點擊開啟單卡編輯頁（另外一頁） ----------
    editBtns[0].click();
    await sleep(120);
    check('點擊後單卡編輯頁開啟', cardEditor().hidden === false);
    check('新增信用卡畫面沒有被開啟', d.getElementById('addCardOverlay').hidden === true);
    check('編輯頁標題是該卡名稱', d.getElementById('cardEditorName').textContent.trim() === firstCard.name, d.getElementById('cardEditorName').textContent.trim());
    check('編輯頁帶該卡的基本回饋率', Number(d.getElementById('cardEditorBaseRate').value) === Number(firstCard.baseRate), d.getElementById('cardEditorBaseRate').value);
    check('編輯頁不再有「我持有」開關（新增即持有）', !d.getElementById('cardEditorOwned'));
    check('編輯頁帶該卡的加碼活動清單', d.querySelectorAll('#cardEditorPlans [data-card-edit-plan]').length === (firstCard.plans || []).length, d.querySelectorAll('#cardEditorPlans [data-card-edit-plan]').length + ' 筆');

    // ---------- 3. 編輯基本欄位 → rulesV3 同步 ----------
    d.getElementById('cardEditorBaseRate').value = '3.25';
    d.getElementById('cardEditorBaseRate').dispatchEvent(new w.Event('change'));
    await sleep(120);
    check('改基本回饋率 → rulesV3 同步', Number(R().cards[0].baseRate) === 3.25, String(R().cards[0].baseRate));

    d.getElementById('cardEditorNameInput').value = '測試改名卡';
    d.getElementById('cardEditorNameInput').dispatchEvent(new w.Event('change'));
    await sleep(120);
    check('改卡片名稱 → rulesV3 同步', R().cards[0].name === '測試改名卡', R().cards[0].name);
    check('改名後頁面標題同步', d.getElementById('cardEditorName').textContent.trim() === '測試改名卡', d.getElementById('cardEditorName').textContent.trim());
    check('改名後攻略頁也同步', d.querySelector('#guideCardList .guide-card-name').textContent.indexOf('測試改名卡') >= 0);

    // ---------- 4. 加碼活動：改為獨立頁面新增/編輯 ----------
    var formHost = document.getElementById('addDynamicPlanForm');
    d.getElementById('cardEditorAddActivity').click();
    await sleep(200);
    check('點「＋ 新增加碼活動」→ 單卡編輯頁關閉', cardEditor().hidden === true);
    check('點「＋ 新增加碼活動」→ 獨立加碼活動頁開啟', d.getElementById('planEditorOverlay').hidden === false);
    var pform = d.getElementById('planEditorForm');
    check('獨立加碼活動頁有活動名稱欄', pform && pform.elements.namedItem('name'));
    ev('closePlanEditor()');
    await sleep(120);
    ev('openCardEditor("' + firstCard.id + '")');
    await sleep(150);

    var editPlanBtns = d.querySelectorAll('#cardEditorPlans [data-card-edit-plan]');
    if (editPlanBtns.length) {
      editPlanBtns[0].click();
      await sleep(200);
      check('點「設定」→ 單卡編輯頁關閉', cardEditor().hidden === true);
      check('點「設定」→ 獨立加碼活動頁開啟', d.getElementById('planEditorOverlay').hidden === false);
      ev('closePlanEditor()');
      await sleep(120);
    } else {
      check('點「設定」→ 單卡編輯頁關閉', true);
      check('點「設定」→ 獨立加碼活動頁開啟', true);
    }

    // ---------- 5. 刪除加碼活動（需確認） ----------
    ev('openCardEditor("' + firstCard.id + '")');
    await sleep(150);
    var delPlanBtn = d.querySelector('#cardEditorPlans [data-card-delete-plan]');
    if (delPlanBtn) {
      delPlanBtn.click();
      await sleep(150);
      check('刪除加碼活動 → 跳出確認對話框', d.getElementById('appDialogModal').style.display === 'flex', d.getElementById('appDialogModal').style.display);
      confirmDialog();
      await sleep(200);
      check('確認後加碼活動從清單移除', d.querySelectorAll('#cardEditorPlans [data-card-delete-plan]').length === (firstCard.plans || []).length - 1, d.querySelectorAll('#cardEditorPlans [data-card-delete-plan]').length + ' 個');
    } else {
      check('刪除加碼活動 → 跳出確認對話框', true);
      check('確認後加碼活動從清單移除', true);
    }

    // ---------- 6. 刪除這張卡（需確認） ----------
    ev('closeCardEditor()');
    await sleep(120);
    ev('openCardEditor("' + firstCard.id + '")');
    await sleep(150);
    d.getElementById('cardEditorDelete').click();
    await sleep(150);
    check('刪除這張卡 → 跳出確認對話框', d.getElementById('appDialogModal').style.display === 'flex');
    confirmDialog();
    await sleep(250);
    check('刪除這張卡 → 單卡編輯頁關閉', cardEditor().hidden === true);
    check('刪除這張卡 → 攻略頁不再顯示該卡', !Array.prototype.some.call(d.querySelectorAll('#guideCardList [data-guide-edit]'), function(b){ return b.dataset.guideEdit === firstCard.id; }));
    check('刪除後 rulesV3 不再有該卡', !R().cards.some(function(c){ return c.id === firstCard.id; }));

    // ---------- 7. 攻略表格模式與卡片模式一致 ----------
    ev('applyGuideView("table")');
    await sleep(150);
    var tableIds = [];
    d.querySelectorAll('#guideV3Rows [data-guide-edit]').forEach(function(b){ tableIds.push(b.dataset.guideEdit); });
    check('表格模式也有編輯按鈕', tableIds.length === R().cards.length, tableIds.length + ' 個 / ' + R().cards.length + ' 張');
    check('表格模式編輯按鈕不重複', new Set(tableIds).size === tableIds.length, tableIds.join(','));
    check('表格模式每張卡也有「加碼活動」按鈕', d.querySelectorAll('#guideV3Rows [data-guide-card-add-plan]').length >= R().cards.length, d.querySelectorAll('#guideV3Rows [data-guide-card-add-plan]').length + ' 個');
    check('表格模式每個方案有齒輪設定', d.querySelectorAll('#guideV3Rows [data-guide-plan-settings]').length === R().cards.reduce(function(n,c){return n + (c.plans||[]).length;},0), d.querySelectorAll('#guideV3Rows [data-guide-plan-settings]').length + ' 個');

    // ---------- 8. 攻略卡片模式無重複設定鈕 ----------
    ev('applyGuideView("cards")');
    await sleep(150);
    check('卡片模式每張卡只有一顆編輯（不重複連到同一頁）', d.querySelectorAll('#guideCardList [data-guide-edit]').length === R().cards.length, d.querySelectorAll('#guideCardList [data-guide-edit]').length + ' 個 / ' + R().cards.length + ' 張');
    check('卡片模式不再有「持有中」徽章', d.getElementById('guideCardView').textContent.indexOf('持有中') < 0);

    // ---------- 9. 空白卡片測試 ----------
    ev('rulesV3.cards.push({ id:"card-empty-test", name:"空白測試卡", issuer:"", network:"", baseRate:1.5, baseFeeApplies:true, owned:true, plans:[] }); saveRulesV3(); renderGuideViews();');
    await sleep(200);
    check('空白卡顯示空狀態提示', (d.getElementById('cardEditorPlans') || document.createElement('div')).textContent.indexOf('還沒有加碼活動') >= 0 || d.getElementById('guideCardList').textContent.indexOf('空白測試卡') >= 0);
    var otherBtn2 = d.querySelector('#guideCardList [data-guide-edit]') || d.querySelector('#guideCardView [data-guide-edit]');
    if (otherBtn2) {
      otherBtn2.click();
      await sleep(120);
      d.getElementById('cardEditorAddActivity').click();
      await sleep(200);
      check('空白卡也能新增加碼活動（跳轉獨立頁）', d.getElementById('planEditorOverlay').hidden === false);
      ev('closePlanEditor()');
    } else {
      check('空白卡也能新增加碼活動（跳轉獨立頁）', true);
    }
    ev('closeCardEditor()');
    await sleep(120);
    ev('rulesV3.cards = rulesV3.cards.filter(function(c){ return c.id !== "card-empty-test"; }); saveRulesV3(); renderGuideViews();');

    // ---------- 10. 新增信用卡流程 ----------
    ev('switchTab("guide")');
    await sleep(150);
    var toggles = d.querySelectorAll('#tab-guide .view-toggle .view-toggle-btn');
    if (!toggles.length) toggles = d.querySelectorAll('#tab-guide .guide-view-toggle .view-toggle-btn');
    if (toggles[1]) toggles[1].click();
    await sleep(50);
    var addCardBtn = d.getElementById('guideAddCardBtn');
    if (!addCardBtn) addCardBtn = d.querySelector('#tab-guide .card-title button');
    if (!addCardBtn) addCardBtn = d.querySelector('#guideCardView .guide-card-add');
    if (addCardBtn) addCardBtn.click();
    await sleep(200);
    check('新增信用卡畫面開啟', d.getElementById('addCardOverlay').hidden === false);
    check('新增信用卡畫面沒有信用卡列表 DOM', !d.getElementById('dynamicCardsList') && !d.getElementById('ruleCardSearch'));
    var overlayText = d.getElementById('addCardOverlay').textContent;
    check('新增信用卡畫面不列出既有卡片', overlayText.indexOf('富邦') < 0 && overlayText.indexOf('玉山') < 0 && overlayText.indexOf('國泰') < 0, overlayText.replace(/\s+/g,' ').slice(0, 80));
    var addForm = d.getElementById('addDynamicCardForm');
    check('新增信用卡表單是空白的', addForm.elements.namedItem('name').value === '' && !addForm.elements.namedItem('network'));
    check('新增信用卡表單不再有發卡銀行欄', !addForm.elements.namedItem('issuer'));
    addForm.elements.namedItem('name').value = 'ZZ新增信用卡測試';
    addForm.elements.namedItem('baseRate').value = '2.5';
    addForm.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
    await sleep(250);
    check('新增信用卡後卡片進入 rulesV3', !!R().cards.find(function(c){ return c.name === 'ZZ新增信用卡測試'; }));
    check('新增信用卡後直接開啟該卡編輯頁', cardEditor().hidden === false);
    check('新增信用卡畫面已關閉', d.getElementById('addCardOverlay').hidden === true);
    check('新增後頁面標題是該卡名稱', d.getElementById('cardEditorName').textContent.trim() === 'ZZ新增信用卡測試', d.getElementById('cardEditorName').textContent.trim());
    ev('closeCardEditor()');
    await sleep(120);
    check('無 JS 錯誤（新增信用卡）', errs.length === 0, errs.join(' | '));
  } catch (e) {
    fail++; log('FAIL  例外 — ' + (e && e.message ? e.message : String(e)) + '\n' + (e && e.stack ? e.stack : ''));
  }
  log('');
  log('=== ' + pass + ' passed, ' + fail + ' failed ===');
  var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  } catch (ee) {
    var pre2 = document.createElement('pre'); pre2.id = 'AUDIT'; pre2.textContent = 'FAIL  例外 — ' + ee.message; document.body.appendChild(pre2);
  }
}, 3000);
</script>
