<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
setTimeout(async function () {
  var out = []; var log = function (m) { out.push(m); }; var pass = 0, fail = 0;
  function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
  function finish() {
    log(''); log('=== ' + pass + ' passed, ' + fail + ' failed ===');
    var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  }
  try {
    var w = document.getElementById('f').contentWindow, d = w.document;
    await sleep(300);
    var E = w.RuleEngine;
    check('RuleEngine 已載入', !!E && typeof E.getPeriodKey === 'function', E && E.version);

    function date(y, m, day) { return { year: y, month: m, day: day }; }
    function key(plan, part, dt) { return E.getPeriodKey(plan, part, dt); }

    // ---------- 週期 key：月 / 季 / 活動 ----------
    check('月週期 key', key({ cycle: 'month' }, {}, date(2026, 11, 9)) === '2026-11', key({ cycle: 'month' }, {}, date(2026, 11, 9)));
    check('月週期補零', key({ cycle: 'month' }, {}, date(2026, 1, 2)) === '2026-01', key({ cycle: 'month' }, {}, date(2026, 1, 2)));
    check('季週期 Q1', key({ cycle: 'quarter' }, {}, date(2026, 2, 1)) === '2026-Q1', key({ cycle: 'quarter' }, {}, date(2026, 2, 1)));
    check('季週期 Q2', key({ cycle: 'quarter' }, {}, date(2026, 4, 1)) === '2026-Q2', key({ cycle: 'quarter' }, {}, date(2026, 4, 1)));
    check('季週期 Q4', key({ cycle: 'quarter' }, {}, date(2026, 11, 9)) === '2026-Q4', key({ cycle: 'quarter' }, {}, date(2026, 11, 9)));
    check('活動週期使用起訖日', key({ cycle: 'campaign' }, { start: '2026-11-01', end: '2026-12-31' }, date(2026, 11, 9)) === 'campaign:2026-11-01:2026-12-31');
    check('part 週期覆寫 plan 週期', key({ cycle: 'month' }, { cycle: 'quarter' }, date(2026, 5, 2)) === '2026-Q2');
    check('無週期回傳 null', key({ cycle: 'none' }, {}, date(2026, 11, 9)) === null, String(key({ cycle: 'none' }, {}, date(2026, 11, 9))));

    // ---------- 結帳日週期 ----------
    var billing = { cycle: 'billing', statementDay: 18 };
    check('結帳日前一天仍在同一期', key(billing, {}, date(2026, 11, 9)) === 'billing:2026-11-18', key(billing, {}, date(2026, 11, 9)));
    check('結帳日當天仍在同一期', key(billing, {}, date(2026, 11, 18)) === 'billing:2026-11-18', key(billing, {}, date(2026, 11, 18)));
    check('結帳日後一天進入下一期', key(billing, {}, date(2026, 11, 19)) === 'billing:2026-12-18', key(billing, {}, date(2026, 11, 19)));
    check('跨年份結帳日', key(billing, {}, date(2026, 12, 19)) === 'billing:2027-01-18', key(billing, {}, date(2026, 12, 19)));
    check('未設定結帳日回傳 null', key({ cycle: 'billing' }, {}, date(2026, 11, 9)) === null);
    check('結帳日超出範圍回傳 null', key({ cycle: 'billing', statementDay: 32 }, {}, date(2026, 11, 9)) === null);

    // 31 日結帳日碰到短月份要夾到月底
    check('1/31 結帳日：2 月夾到 28 日', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 2, 1)) === 'billing:2026-02-28', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 2, 1)));
    check('1/31 結帳日：2/28 當天仍在同一期', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 2, 28)) === 'billing:2026-02-28', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 2, 28)));
    check('1/31 結帳日：3/1 進入 3 月期', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 3, 1)) === 'billing:2026-03-31', key({ cycle: 'billing', statementDay: 31 }, {}, date(2026, 3, 1)));
    check('閏年 2 月夾到 29 日', key({ cycle: 'billing', statementDay: 31 }, {}, date(2028, 2, 1)) === 'billing:2028-02-29', key({ cycle: 'billing', statementDay: 31 }, {}, date(2028, 2, 1)));
    check('閏年 2/29 當天仍在同一期', key({ cycle: 'billing', statementDay: 31 }, {}, date(2028, 2, 29)) === 'billing:2028-02-29', key({ cycle: 'billing', statementDay: 31 }, {}, date(2028, 2, 29)));

    // ---------- 與 index.html 目前行為對照（同一份日期） ----------
    var now = w.getTaipeiDateParts();
    var parityPlans = [
      [{ cycle: 'month' }, {}],
      [{ cycle: 'quarter' }, {}],
      [{ cycle: 'billing', statementDay: 18 }, {}],
      [{ cycle: 'campaign' }, { start: '2026-01-01', end: '2026-12-31' }]
    ];
    var parityOk = parityPlans.every(function (pair) {
      return w.getV3PeriodKey(pair[0], pair[1]) === E.getPeriodKey(pair[0], pair[1], now);
    });
    check('週期 key 與現有 UI 行為一致', parityOk, JSON.stringify(now));

    // ---------- 情境 OR 匹配 ----------
    check('單一情境命中', E.planMatchesContexts(['transit'], ['transit']) === true);
    check('多情境 OR 命中', E.planMatchesContexts(['transit', 'merchant'], ['merchant']) === true);
    check('無交集不命中', E.planMatchesContexts(['transit'], ['general']) === false);
    check('一般消費方案可被特約商店相容命中', E.planMatchesContexts(['general'], ['merchant'], { merchantIncludesGeneral: true }) === true);
    check('未開啟相容時一般消費不命中特約商店', E.planMatchesContexts(['general'], ['merchant']) === false);
    check('Set 形式的情境也可匹配', E.planMatchesContexts(['transit'], new Set(['transit'])) === true);
    check('空情境不命中', E.planMatchesContexts([], ['general']) === false);

    // ---------- 店家文字解析 ----------
    var parsed = E.parseMerchantText(' 唐吉訶德, BicCamera，UNIQLO、唐吉訶德\nBicCamera ');
    check('店家文字解析支援多種分隔符', String(parsed) === '唐吉訶德,BicCamera,UNIQLO', String(parsed));
    check('店家文字去重且保留順序', parsed.length === 3 && parsed[0] === '唐吉訶德', parsed.join('|'));
    check('空白店家文字回傳空陣列', E.parseMerchantText('  ').length === 0);
    check('店家文字與 UI 解析一致', String(w.parsePlanMerchantText('A,B，A\nC')) === 'A,B,C');

    // ---------- 單一方案評估（純函式） ----------
    check('RuleEngine 有 evaluatePlan', typeof E.evaluatePlan === 'function');
    var card = { id: 'c1', name: '測試卡', baseRate: 2, baseFeeApplies: true };
    var plan = {
      id: 'p1', contexts: ['general'], cycle: 'month', includeBaseReward: true,
      rewardParts: [
        { id: 'a', name: '加碼A', rate: 5, capAmount: 1000, usedReward: 200, periodKey: '2026-10', cumulativePeriodKey: '2026-10', cumulativeSpendTwd: 500 },
        { id: 'b', name: '加碼B', rate: 3, capAmount: 500, usedReward: 100, periodKey: '2026-11', cumulativePeriodKey: '2026-11', cumulativeSpendTwd: 0 }
      ]
    };
    var before = JSON.stringify(plan);
    var res = E.evaluatePlan({ card: card, plan: plan, spendTwd: 10000, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('評估回傳 offer / partChanges / periodReset', !!res.offer && Array.isArray(res.partChanges) && res.periodReset === true);
    check('評估不修改傳入的 plan', JSON.stringify(plan) === before, JSON.stringify(plan.rewardParts[0]));
    check('跨週期 usedReward 重置為 0（變更清單）', res.partChanges.some(function (c) { return c.partId === 'a' && c.usedReward === 0; }));
    check('同週期 usedReward 不重置', !res.partChanges.some(function (c) { return c.partId === 'b' && c.usedReward !== undefined; }));
    check('跨週期 cumulativeSpendTwd 重置為 0', res.partChanges.some(function (c) { return c.partId === 'a' && c.cumulativeSpendTwd === 0; }));
    check('評估淨回饋正確（500 + 300 + 200 - 150）', Math.round(res.offer.net) === 850, String(res.offer.net));
    check('評估加碼明細正確', res.offer.matchedParts.length === 2 && Math.round(res.offer.matchedParts[0].reward) === 500 && Math.round(res.offer.matchedParts[1].reward) === 300, JSON.stringify(res.offer.matchedParts.map(function (p) { return p.reward; })));

    // 共用 quota group：同一組額度只扣一次
    var groupPlan = {
      id: 'g', contexts: ['transit'], cycle: 'month', includeBaseReward: true,
      rewardParts: [
        { id: 'g1', name: '共用A', rate: 5, capAmount: 1000, usedReward: 200, quotaGroupId: 'grp', periodKey: '2026-11' },
        { id: 'g2', name: '共用B', rate: 3, capAmount: 1000, usedReward: 200, quotaGroupId: 'grp', periodKey: '2026-11' }
      ]
    };
    var gRes = E.evaluatePlan({ card: card, plan: groupPlan, spendTwd: 10000, contexts: ['transit'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('共用額度先扣第一段', Math.round(gRes.offer.matchedParts[0].reward) === 500, String(gRes.offer.matchedParts[0].reward));
    check('共用額度第二段只剩 100', Math.round(gRes.offer.matchedParts[1].reward) === 100, String(gRes.offer.matchedParts[1].reward));
    check('共用額度只扣一次（總加碼 600）', Math.round(gRes.offer.bonus) === 600, String(gRes.offer.bonus));

    // 累積門檻
    var cumPlan = {
      id: 'cum', contexts: ['general'], cycle: 'month', includeBaseReward: true,
      rewardParts: [{ id: 'cum1', name: '累積加碼', rate: 5, thresholdTwd: 3000, thresholdType: 'cumulative', cumulativeSpendTwd: 2000, periodKey: '2026-11', cumulativePeriodKey: '2026-11' }]
    };
    var cumShort = E.evaluatePlan({ card: card, plan: cumPlan, spendTwd: 500, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('累積門檻未達不計加碼', cumShort.offer.matchedParts.length === 0 && /週期累積未達/.test(cumShort.offer.notes.join('')), cumShort.offer.notes.join('|'));
    check('累積門檻會標記 cumulativePartIds', cumShort.offer.cumulativePartIds.indexOf('cum1') >= 0, String(cumShort.offer.cumulativePartIds));
    var cumHit = E.evaluatePlan({ card: card, plan: cumPlan, spendTwd: 1000, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('累積門檻達標後計入加碼', cumHit.offer.matchedParts.length === 1 && Math.round(cumHit.offer.bonus) === 50, String(cumHit.offer.bonus));

    // 特約商店名單：只有 merchant 情境時才強制比對
    var merchantPlan = {
      id: 'm', contexts: ['merchant'], cycle: 'month', includeBaseReward: true, merchants: ['BicCamera'],
      rewardParts: [{ id: 'm1', name: '特店加碼', rate: 5, capAmount: 1000, periodKey: '2026-11' }]
    };
    var mMiss = E.evaluatePlan({ card: card, plan: merchantPlan, spendTwd: 10000, merchant: '唐吉訶德', contexts: ['merchant'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('特約商店名單未命中不計加碼', mMiss.offer.matchedParts.length === 0, JSON.stringify(mMiss.offer.matchedParts));
    var mHit = E.evaluatePlan({ card: card, plan: merchantPlan, spendTwd: 10000, merchant: 'BicCamera', contexts: ['merchant'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('特約商店名單命中計入加碼', mHit.offer.matchedParts.length === 1, JSON.stringify(mHit.offer.matchedParts));
    var mCross = E.evaluatePlan({ card: card, plan: Object.assign({}, merchantPlan, { contexts: ['merchant', 'transit'] }), spendTwd: 10000, merchant: '唐吉訶德', contexts: ['transit'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('跨情境共用方案不因特店名單擋掉', mCross.offer.matchedParts.length === 1, JSON.stringify(mCross.offer.matchedParts));

    // 特約店家是原文，不是拆好的店名清單：搜尋字串出現在原文就命中
    check('getMerchantText 新資料以原文為準', E.getMerchantText({ merchantText: '指定特店：松本清、BicCamera', merchants: ['舊資料'] }) === '指定特店：松本清、BicCamera');
    check('getMerchantText 舊資料回退 merchants', E.getMerchantText({ merchants: ['A', 'B'] }) === 'A、B');
    check('merchantTextMatches 原文片段即命中', E.merchantTextMatches({ merchantText: '指定特店：松本清、BicCamera' }, '松本清') === true);
    check('merchantTextMatches 反向命中較長的明細字串', E.merchantTextMatches({ merchantText: '松本清' }, '松本清合利他命') === true);
    check('merchantTextMatches 未命中', E.merchantTextMatches({ merchantText: '松本清、BicCamera' }, '唐吉訶德') === false);
    var rawMerchantPlan = Object.assign({}, merchantPlan, { merchants: [], merchantText: '指定特店：BicCamera、松本清' });
    var mRawHit = E.evaluatePlan({ card: card, plan: rawMerchantPlan, spendTwd: 10000, merchant: 'BicCamera', contexts: ['merchant'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('特約方案用原文片段命中時計入加碼', mRawHit.offer.matchedParts.length === 1, JSON.stringify(mRawHit.offer.matchedParts));

    // 結帳日未設定提示
    var billPlan = { id: 'bill', contexts: ['general'], cycle: 'billing', includeBaseReward: true, rewardParts: [{ id: 'bill1', name: '帳單加碼', rate: 5 }] };
    var billRes = E.evaluatePlan({ card: card, plan: billPlan, spendTwd: 10000, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('結帳日未設定會產生提示', billRes.offer.notes.some(function (n) { return /結帳日/.test(n); }), billRes.offer.notes.join('|'));

    // 活動期間外不計
    var campaignPlan = { id: 'camp', contexts: ['general'], cycle: 'campaign', includeBaseReward: true, rewardParts: [{ id: 'camp1', name: '活動加碼', rate: 5, start: '2026-12-01', end: '2026-12-31' }] };
    var campRes = E.evaluatePlan({ card: card, plan: campaignPlan, spendTwd: 10000, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('活動期間外不計加碼', campRes.offer.matchedParts.length === 0, JSON.stringify(campRes.offer.matchedParts));

    // 不併基本回饋 + fallbackBase
    var noBasePlan = { id: 'nb', contexts: ['general'], cycle: 'month', includeBaseReward: false, fallbackBase: true, baseRateOverride: 1, rewardParts: [{ id: 'nb1', name: '加碼', rate: 5, capAmount: 1000, periodKey: '2026-11' }] };
    var nbRes = E.evaluatePlan({ card: card, plan: noBasePlan, spendTwd: 10000, contexts: ['general'], today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('不併基本回饋時 fallbackSpend 為 0', Math.round(nbRes.offer.base) === 0, String(nbRes.offer.base));
    check('不併基本回饋仍計入加碼', Math.round(nbRes.offer.bonus) === 500, String(nbRes.offer.bonus));

    // ---------- 多卡排序與最佳方案（純函式） ----------
    check('RuleEngine 有 rankOffers', typeof E.rankOffers === 'function');
    var rankCards = [
      { id: 'rankA', name: '排序卡A', baseRate: 2, baseFeeApplies: false, plans: [
        { id: 'rankA1', name: 'A一般', contexts: ['general'], includeBaseReward: true, cycle: 'month', rewardParts: [
          { id: 'rankA1p', name: 'A加碼', rate: 3, capAmount: 100000, periodKey: '2026-11' }
        ] }
      ] },
      { id: 'rankB', name: '排序卡B', baseRate: 1, baseFeeApplies: false, plans: [
        { id: 'rankB1', name: 'B一般', contexts: ['general'], includeBaseReward: true, cycle: 'month', rewardParts: [
          { id: 'rankB1p', name: 'B加碼', rate: 8, capAmount: 100000, periodKey: '2026-11' }
        ] }
      ] }
    ];
    var rank1 = E.rankOffers({ cards: rankCards, contexts: ['general'], spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('rankOffers 依淨回饋由高到低排序', rank1.offers[0].card.id === 'rankB' && rank1.offers[1].card.id === 'rankA', rank1.offers.map(function (o) { return o.card.id + ':' + Math.round(o.net); }).join('|'));
    check('rankOffers 回傳未套用偏好前的店家候選', rank1.storeOffers[0].card.id === 'rankB' && rank1.storeBest.card.id === 'rankB', rank1.storeOffers.map(function (o) { return o.card.id; }).join('|'));
    var rankPref = E.rankOffers({ cards: rankCards, contexts: ['general'], spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9), preferredCardId: 'rankA' });
    check('rankOffers 指定卡片會排到最前且不改店家最高', rankPref.offers[0].card.id === 'rankA' && rankPref.preferredApplied === true && rankPref.preferredCardId === 'rankA' && rankPref.storeBest.card.id === 'rankB', rankPref.offers.map(function (o) { return o.card.id; }).join('|'));
    var rankPrefMiss = E.rankOffers({ cards: rankCards, contexts: ['general'], spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9), preferredCardId: 'missing' });
    check('rankOffers 指定卡片不存在會清除偏好', rankPrefMiss.preferredApplied === false && rankPrefMiss.preferredCardId === '', rankPrefMiss.preferredCardId);

    var rankMerchantCards = [
      { id: 'rankKuma', name: '熊本熊', baseRate: 2.5, baseFeeApplies: true, plans: [
        { id: 'rankKumaM', name: '特店方案', contexts: ['merchant'], includeBaseReward: true, cycle: 'month', merchantText: 'BicCamera', rewardParts: [
          { id: 'rankKumaM1', name: '特店加碼', rate: 6, capAmount: 100000, periodKey: '2026-11' }
        ] }
      ] },
      { id: 'rankGeneral', name: '一般卡', baseRate: 2, baseFeeApplies: false, plans: [
        { id: 'rankGeneralG', name: '一般方案', contexts: ['general'], includeBaseReward: true, cycle: 'month', rewardParts: [
          { id: 'rankGeneralG1', name: '一般加碼', rate: 30, capAmount: 100000, periodKey: '2026-11' }
        ] }
      ] }
    ];
    var rankMiss = E.rankOffers({ cards: rankMerchantCards, contexts: ['merchant'], merchant: '不存在的店', spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9) });
    var kumaMiss = rankMiss.offers.find(function (o) { return o.card.id === 'rankKuma'; });
    check('rankOffers 特店未命中仍保留該卡基本回饋', !!kumaMiss && kumaMiss.plan.name === '基本回饋' && Math.round(kumaMiss.base) === 250, kumaMiss ? kumaMiss.plan.name + ':' + Math.round(kumaMiss.base) : 'missing');
    check('rankOffers 特店未命中時一般方案仍參與比較', rankMiss.offers[0].card.id === 'rankGeneral', rankMiss.offers.map(function (o) { return o.card.id + ':' + Math.round(o.net); }).join('|'));
    var rankHit = E.rankOffers({ cards: rankMerchantCards, contexts: ['merchant'], merchant: 'BicCamera', spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9) });
    var kumaHit = rankHit.offers.find(function (o) { return o.card.id === 'rankKuma'; });
    check('rankOffers 特店命中時使用特店方案', !!kumaHit && kumaHit.plan.name === '特店方案' && Math.round(kumaHit.bonus) === 600, kumaHit ? kumaHit.plan.name + ':' + Math.round(kumaHit.bonus) : 'missing');
    check('rankOffers 特店命中時一般高回饋仍可勝出', rankHit.offers[0].card.id === 'rankGeneral', rankHit.offers.map(function (o) { return o.card.id + ':' + Math.round(o.net); }).join('|'));
    var rankPaypay = E.rankOffers({ cards: rankMerchantCards, contexts: ['paypay'], spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('rankOffers PayPay-only 不加基本回饋 fallback', rankPaypay.offers.length === 0, String(rankPaypay.offers.length));

    var rankResetPlan = { id: 'rankReset', name: '重置方案', contexts: ['general'], includeBaseReward: true, cycle: 'month', rewardParts: [
      { id: 'rankResetP', name: '重置加碼', rate: 5, capAmount: 100000, periodKey: '2026-10' }
    ] };
    var rankResetCard = { id: 'rankResetCard', name: '重置卡', baseRate: 2, baseFeeApplies: false, plans: [rankResetPlan] };
    var rankResetBefore = JSON.stringify(rankResetCard);
    var rankResetResult = E.rankOffers({ cards: [rankResetCard], contexts: ['general'], spendTwd: 10000, today: '2026-11-09', dateParts: date(2026, 11, 9) });
    check('rankOffers 不直接修改卡片，跨週期重置以 partChanges 回傳', JSON.stringify(rankResetCard) === rankResetBefore && rankResetResult.periodReset === true && rankResetResult.partChanges.some(function (item) {
      return item.cardId === 'rankResetCard' && item.planId === 'rankReset' && item.change.partId === 'rankResetP' && item.change.periodKey === '2026-11' && item.change.usedReward === 0;
    }), JSON.stringify(rankResetResult.partChanges));

    // ---------- 拆刷配置（純函式） ----------
    check('RuleEngine 有 allocateSplit', typeof E.allocateSplit === 'function');
    function offerFor(card, plan, spendTwd) {
      return E.evaluatePlan({
        card: card,
        plan: plan,
        spendTwd: spendTwd,
        merchant: '',
        contexts: ['general'],
        today: '2026-11-09',
        dateParts: date(2026, 11, 9)
      }).offer;
    }

    var splitCardA = { id: 'splitA', name: '拆刷卡A', baseRate: 1, baseFeeApplies: false };
    var splitCardB = { id: 'splitB', name: '拆刷卡B', baseRate: 2, baseFeeApplies: false };
    var splitPlanA = { id: 'splitA-plan', name: 'A方案', contexts: ['general'], includeBaseReward: true, rewardParts: [
      { id: 'splitA-part', name: 'A加碼', rate: 10, capAmount: 100, periodKey: '2026-11' }
    ] };
    var splitPlanB = { id: 'splitB-plan', name: 'B方案', contexts: ['general'], includeBaseReward: true, rewardParts: [] };
    var splitOfferA = offerFor(splitCardA, splitPlanA, 5000);
    var splitOfferB = offerFor(splitCardB, splitPlanB, 5000);
    var split1 = E.allocateSplit({ offers: [splitOfferA, splitOfferB], spendTwd: 5000 });
