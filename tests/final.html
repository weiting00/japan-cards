<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
setTimeout(async function () {
  var out = []; var log = function (m) { out.push(m); }; var pass = 0, fail = 0;
  function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  try {
    var w = document.getElementById('f').contentWindow, d = w.document;
    var errs = []; w.addEventListener('error', function(e){ errs.push(e.message); });
    w.openCardEditor(w.eval('rulesV3.cards[0].id'));
    await sleep(150);
    d.getElementById('cardEditorAddActivity').click();
    await sleep(200);
    var form = d.getElementById('planEditorForm');
    check('獨立加碼活動頁已開啟', d.getElementById('planEditorOverlay').hidden === false);
    var ml = d.getElementById('planEditorMerchantLabel');
    check('特約商店欄預設真的不顯示', !!ml && ml.hidden === true, ml ? String(ml.hidden) : 'missing');
    form.querySelector('input[name="context"][value="merchant"]').checked = true;
    form.querySelector('input[name="context"][value="merchant"]').dispatchEvent(new w.Event('change', {bubbles:true}));
    await sleep(50);
    check('切特約商店後真的顯示', !!ml && ml.hidden === false, ml ? String(ml.hidden) : 'missing');
    check('適用店家為文字框（不點選）', !!d.getElementById('planEditorMerchants') && /textarea|input/i.test(d.getElementById('planEditorMerchants').tagName));

    // 「加碼用完或不符合加碼條件」與「官方規則來源」直接顯示在表單中（不再收在進階）
    check('不再有進階摺疊區', !form.querySelector('.activity-advanced'));
    check('加碼用完或不符合加碼條件為二元選項', !!form.querySelector('input[name="fallback"][value="base"]') && !!form.querySelector('input[name="fallback"][value="none"]') && !form.querySelector('select[name="fallback"]'));
    check('加碼用完或不符合加碼條件名稱正確', form.textContent.indexOf('加碼用完或不符合加碼條件') >= 0);
    check('官方規則來源欄位直接可見', !!form.querySelector('input[name="sourceUrl"]'));

    // 舊版規則表已全面移除
    check('舊版規則表 DOM 已移除', !d.getElementById('ruleGuideRows') && !d.getElementById('toggleRuleEdit') && !d.getElementById('ruleEditActions') && !d.getElementById('ruleChangeModal'));
    check('舊版規則編輯函式已移除', typeof w.cancelRuleEdit === 'undefined' && typeof w.toggleRuleEdit === 'undefined' && typeof w.renderRuleGuideTable === 'undefined');

    // 保留既有 DOM id（隨獨立加碼活動頁/決策頁提示化調整）
    check('保留既有 DOM id', ['addDynamicCardForm','planEditorForm','planEditorMerchantLabel','planEditorMerchants','merchantChoice','cancelPlanEdit','guideCardList','guideV3Rows','resultMerchantOpen','resultMerchantTrigger','resultMerchantSearch','resultMerchantList','resultMerchantFeedback','resultStoreNote'].every(function (id) { return !!d.getElementById(id); }));
    check('已移除沒有通用性的熊本熊/場景守則區塊', !d.getElementById('kumaGuideCard') && !d.getElementById('kumaGuideTitle') && !d.getElementById('ruleGuideSummary'));
    check('信用卡列表 DOM 已移除', !d.getElementById('dynamicCardsList') && !d.getElementById('ruleCardSearch'));

    // 特約商店查詢改成「推薦結果」底下的入口，不再在推薦前先列出商店總覽
    w.closePlanEditor({force:true});
    await sleep(100);
    w.closeCardEditor();
    check('決策頁 merchantChoice 相容欄位存在', !!d.getElementById('merchantChoice'));
    check('決策頁不再有推薦前的商店總覽', !d.getElementById('decisionMerchantOverview') && !d.getElementById('decisionMerchantSearch') && !d.getElementById('decisionMerchantList'));
    check('決策頁不再有重複的自填店家備註欄', !d.getElementById('merchantNote'));
    check('決策頁不再有可選店家清單', !d.getElementById('merchantChoiceList'));
    check('特約商店查詢入口在推薦結果內', d.getElementById('resultBox').contains(d.getElementById('resultMerchantOpen')));
    check('特約商店查詢彈窗獨立於推薦結果', !d.getElementById('resultBox').contains(d.getElementById('resultMerchantTrigger')));

    // 決策情境為單選：點下一個情境會取代上一個，不會同時存在
    w.switchTab('decision');
    await sleep(50);
    d.querySelector('[data-scenario="transit"]').click();
    await sleep(30);
    var transitBtn = d.querySelector('[data-scenario="transit"]');
    var merchantBtn = d.querySelector('[data-scenario="merchant"]');
    var ctx1 = w.eval('[...selectedDecisionContexts]');
    check('決策情境可選交通卡', transitBtn.classList.contains('active') && ctx1.length === 1 && ctx1[0] === 'transit', ctx1.join(','));
    merchantBtn.click();
    await sleep(30);
    var ctx2 = w.eval('[...selectedDecisionContexts]');
    check('決策情境切換後只剩特約商店', merchantBtn.classList.contains('active') && !transitBtn.classList.contains('active') && ctx2.length === 1 && ctx2[0] === 'merchant', ctx2.join(','));
    merchantBtn.click();
    await sleep(30);
    check('再次點選同一個情境仍保持選取', merchantBtn.classList.contains('active') && w.eval('selectedDecisionContexts.size') === 1);
    check('決策頁只有一個情境是 active', d.querySelectorAll('.scenario-option.active').length === 1, d.querySelectorAll('.scenario-option.active').length + ' 個');
    check('情境按鈕不再顯示灰色副標', d.querySelectorAll('.scenario-option small').length === 0, d.querySelectorAll('.scenario-option small').length + ' 個');
    var scenarioHeight = d.querySelector('.scenario-option').getBoundingClientRect().height;
    check('情境按鈕高度已縮小', scenarioHeight > 0 && scenarioHeight <= 72, scenarioHeight + 'px');

    // 特約商店查詢：店家原文照原本方式掛在推薦方案底下；明細下方只有一顆按鈕開彈窗
    var memoInput = d.getElementById('memo');
    memoInput.value = '唐吉訶德、松本清合利他命';
    var merchantTrigger = d.getElementById('resultMerchantTrigger');
    var merchantOpen = d.getElementById('resultMerchantOpen');
    check('尚未完成試算時不顯示用店家搜尋其他卡片按鈕', merchantOpen.hidden === true);
    check('尚未完成試算時特約彈窗是關閉的', merchantTrigger.hidden === true);
    var amountInput = d.getElementById('jpyAmount');
    amountInput.value = '10000';
    amountInput.dispatchEvent(new w.Event('input', {bubbles:true}));
    await sleep(80);
    var planMerchant = d.querySelector('#cardDesc .result-plan-merchant');
    var planMerchantPreview = planMerchant && planMerchant.querySelector('.result-plan-merchant-preview');
    check('推薦方案底下直接顯示特約原文摘要', !!planMerchant && /松本清/.test(planMerchantPreview.textContent), planMerchantPreview ? planMerchantPreview.textContent.slice(0, 80) : '沒有原文區塊');
    check('推薦原文預設收合', planMerchant.tagName === 'DETAILS' && planMerchant.open === false);
    planMerchant.open = true;
    check('推薦原文可展開並看到完整原文', planMerchant.open === true && /松本清/.test(planMerchant.querySelector('.result-plan-merchant-text').textContent));
    planMerchant.open = false;
    check('推薦原文可再收合', planMerchant.open === false);
    check('推薦原文摘要觸控高度 >= 44px', planMerchant.querySelector('.result-plan-merchant-summary').getBoundingClientRect().height >= 44, Math.round(planMerchant.querySelector('.result-plan-merchant-summary').getBoundingClientRect().height) + 'px');
    check('推薦結果出現單一「用店家搜尋其他卡片」按鈕', merchantOpen.hidden === false && /用店家搜尋其他卡片/.test(merchantOpen.textContent), merchantOpen.textContent);
    check('用店家搜尋其他卡片按鈕在推薦結果內', d.getElementById('resultBox').contains(merchantOpen));
    check('用店家搜尋其他卡片按鈕在店家明細下方', d.getElementById('cardDesc').nextElementSibling === merchantOpen);
    check('用店家搜尋其他卡片按鈕觸控高度 >= 44px', merchantOpen.getBoundingClientRect().height >= 44, Math.round(merchantOpen.getBoundingClientRect().height) + 'px');
    check('特約查詢是獨立彈窗', !d.getElementById('resultBox').contains(merchantTrigger) && merchantTrigger.classList.contains('modal-backdrop') && merchantTrigger.getAttribute('role') === 'dialog');
    check('尚未點按鈕時特約彈窗保持關閉', merchantTrigger.hidden === true);
    merchantOpen.click();
    await sleep(60);
    check('點按鈕才會打開特約彈窗', merchantTrigger.hidden === false);
    var lookupBox = merchantTrigger.querySelector('.merchant-lookup-modal');
    var lookupRect = lookupBox && lookupBox.getBoundingClientRect();
    check('特約彈窗在手機寬度內', !!lookupRect && lookupRect.left >= 0 && lookupRect.right <= 390, lookupRect ? Math.round(lookupRect.left) + '~' + Math.round(lookupRect.right) : '沒有彈窗');
    check('彈窗只保留搜尋欄與結果，不顯示店家原文／明細／推薦摘要', !d.getElementById('resultMerchantRaw') && !d.getElementById('resultMerchantMemoBox') && !d.getElementById('resultMerchantRecommend'));
    check('搜尋欄在彈窗內', !!d.getElementById('resultMerchantSearch') && merchantTrigger.contains(d.getElementById('resultMerchantSearch')));
    check('尚未輸入關鍵字時提示直接搜尋', /輸入店名或活動關鍵字/.test(d.getElementById('resultMerchantFeedback').textContent), d.getElementById('resultMerchantFeedback').textContent);
    var modalClose = merchantTrigger.querySelector('.modal-title .icon-btn');
    if (modalClose) modalClose.click();
    await sleep(30);
    check('標題關閉鈕可關閉特約彈窗', !!modalClose && merchantTrigger.hidden === true);
    merchantOpen.click();
    await sleep(30);
    d.dispatchEvent(new w.KeyboardEvent('keydown', {key:'Escape', bubbles:true}));
    await sleep(30);
    check('Esc 可關閉特約彈窗', merchantTrigger.hidden === true);
    merchantOpen.click();
    await sleep(30);
    merchantTrigger.click();
    await sleep(30);
    check('點彈窗背景可關閉特約彈窗', merchantTrigger.hidden === true);
    merchantOpen.click();
    await sleep(30);

    // 加入一張同店卡，驗證「同一家店會列出所有適用卡」，而不是只列推薦卡
    w.eval("rulesV3.cards.find(c=>c.id==='fubon_j').plans.push({id:'test-merchant-plan',name:'測試特店方案',contexts:['merchant'],includeBaseReward:true,foreignFeeApplies:true,noticeFlags:false,merchantText:'指定特店：唐吉訶德、BicCamera（活動原文）',merchants:[],thresholdTwd:0,thresholdType:'single',capAmount:0,cycle:'none',statementDay:null,capBasis:'bonus',fallbackBase:true,enabled:true,rewardParts:[{id:'test-merchant-part',name:'特店加碼',rate:1,capAmount:0,usedReward:0,cycle:'none',thresholdTwd:0,thresholdType:'single',start:'',end:''}]})");
    w.calculate();
    await sleep(40);
    if (merchantTrigger.hidden) merchantOpen.click();
    await sleep(40);
    var merchantSearch = d.getElementById('resultMerchantSearch');
    merchantSearch.value = '唐吉訶德';
    merchantSearch.dispatchEvent(new w.Event('input', {bubbles:true}));
    await sleep(140);
    check('搜尋符合店家會自動帶入決策', d.getElementById('merchantChoice').value === '唐吉訶德');
    var merchantFeedbackText = d.getElementById('resultMerchantFeedback').textContent;
    var merchantHitChip = Array.from(d.querySelectorAll('#resultMerchantList .merchant-card-button small')).find(function (el) { return /特約命中/.test(el.textContent); });
    check('搜尋結果直接標出打中的關鍵字', /搜尋「唐吉訶德」/.test(merchantFeedbackText) && !!merchantHitChip && /特約命中「唐吉訶德」/.test(merchantHitChip.textContent), merchantFeedbackText + ' / ' + (merchantHitChip ? merchantHitChip.textContent : '沒有命中卡片'));
    check('搜尋符合後自動推薦最適合的卡', /玉山熊本熊卡/.test(d.getElementById('bestCard').textContent), d.getElementById('bestCard').textContent);
    check('搜尋後結果出現店家註記', d.getElementById('resultStoreNote').hidden === false && /唐吉訶德/.test(d.getElementById('resultStoreNote').textContent));
    var merchantRow = d.querySelector('#resultMerchantList .merchant-row');
    check('商店查詢列出同一家店的所有適用卡', !!merchantRow && merchantRow.querySelectorAll('.merchant-card-chip').length >= 2, merchantRow ? merchantRow.querySelectorAll('.merchant-card-chip').length + ' 張' : '沒有店家');
    check('商店查詢標記最高與目前推薦', !!merchantRow && !!merchantRow.querySelector('.merchant-card-chip.is-best') && !!merchantRow.querySelector('.merchant-card-chip.is-current'));
    check('命中店家後仍保留單一找特約卡片入口', merchantOpen.hidden === false);
    check('命中店家後特約彈窗仍保持開啟', merchantTrigger.hidden === false);

    var storeOnlyButton = merchantRow && merchantRow.querySelector('[data-result-merchant-auto]');
    check('商店列有「用這家店找最高回饋」動作', !!storeOnlyButton);
    if (storeOnlyButton) storeOnlyButton.click();
    await sleep(100);
    check('選店會把店家條件帶進決策', d.getElementById('merchantChoice').value === '唐吉訶德');
    check('選店後結果出現店家註記', d.getElementById('resultStoreNote').hidden === false && /唐吉訶德/.test(d.getElementById('resultStoreNote').textContent));

    // 直接點另一張卡：指定卡要真的成為結果，不能只是參考清單
    merchantRow = d.querySelector('#resultMerchantList .merchant-row');
    var jCardButton = merchantRow && Array.from(merchantRow.querySelectorAll('.merchant-card-chip')).find(function (button) { return button.dataset.resultMerchantCard === 'fubon_j'; });
    check('商店列可直接選另一張卡', !!jCardButton);
    if (jCardButton) jCardButton.click();
    await sleep(100);
    check('點卡片會指定該卡試算', w.eval('decisionPreferredCardId') === 'fubon_j' && /富邦 J 卡/.test(d.getElementById('bestCard').textContent), d.getElementById('bestCard').textContent);
    check('指定卡後商店註記會說明目前選擇', /富邦 J 卡/.test(d.getElementById('resultStoreNote').textContent));
    check('切換推薦卡後彈窗仍只更新搜尋結果', !!d.getElementById('resultMerchantSearch') && !d.getElementById('resultMerchantRaw') && /搜尋「唐吉訶德」/.test(d.getElementById('resultMerchantFeedback').textContent), d.getElementById('resultMerchantFeedback').textContent);
    check('一般消費方案仍可從同一顆按鈕查其他卡', merchantOpen.hidden === false);

    // 直接搜尋另一家店：有符合就自動換成該店最高回饋
    merchantSearch = d.getElementById('resultMerchantSearch');
    merchantSearch.value = 'BicCamera';
    merchantSearch.dispatchEvent(new w.Event('input', {bubbles:true}));
    await sleep(160);
    check('搜尋另一家店會自動換成該店推薦', d.getElementById('merchantChoice').value === 'BicCamera' && /玉山熊本熊卡/.test(d.getElementById('bestCard').textContent), d.getElementById('bestCard').textContent);
    check('特店卡本身就是最高回饋時，不顯示一般消費較高的原因', !/一般消費淨/.test(d.getElementById('resultStoreNote').textContent), d.getElementById('resultStoreNote').textContent);

    // 特約情境不能只看特店卡：同一筆消費也可能用實體一般消費卡，較高回饋要能勝出
    w.eval("rulesV3.cards.find(c=>c.id==='cathay_cube').plans.push({id:'test-general-high',name:'測試實體高回饋',contexts:['general'],includeBaseReward:false,foreignFeeApplies:false,noticeFlags:false,merchantText:'',merchants:[],thresholdTwd:0,thresholdType:'single',capAmount:0,cycle:'none',statementDay:null,capBasis:'bonus',fallbackBase:false,enabled:true,rewardParts:[{id:'test-general-high-part',name:'實體加碼',rate:30,capAmount:0,usedReward:0,cycle:'none',thresholdTwd:0,thresholdType:'single',start:'',end:''}]})");
    w.calculate();
    await sleep(80);
    check('特約情境會一起比較實體一般消費，較高實體回饋可勝出', /國泰 CUBE 卡/.test(d.getElementById('bestCard').textContent), d.getElementById('bestCard').textContent);
    check('特店命中但一般消費更高時，結果說明原因', /雖然「BicCamera」符合/.test(d.getElementById('resultStoreNote').textContent) && /國泰 CUBE 卡/.test(d.getElementById('resultStoreNote').textContent) && /一般消費淨/.test(d.getElementById('resultStoreNote').textContent) && /更高/.test(d.getElementById('resultStoreNote').textContent), d.getElementById('resultStoreNote').textContent);
    w.renderResultMerchantPanel();
    check('商店面板也把實體一般消費卡列為候選', Array.from(d.querySelectorAll('#resultMerchantList .merchant-card-chip')).some(function (button) { return button.dataset.resultMerchantCard === 'cathay_cube'; }));
    w.eval("rulesV3.cards.find(c=>c.id==='cathay_cube').plans=rulesV3.cards.find(c=>c.id==='cathay_cube').plans.filter(p=>p.id!=='test-general-high')");
    w.calculate();
    await sleep(50);

    // 清除條件與測試資料，讓後面的攻略頁回到預設資料
    w.clearMerchantLookupConditions();
    w.eval("rulesV3.cards.find(c=>c.id==='fubon_j').plans=rulesV3.cards.find(c=>c.id==='fubon_j').plans.filter(p=>p.id!=='test-merchant-plan')");
    w.calculate();
    await sleep(40);
    check('清除店家條件後 merchantChoice 回到空值', d.getElementById('merchantChoice').value === '' && w.eval('decisionPreferredCardId') === '');
    check('清除店家條件後特約彈窗關閉', merchantTrigger.hidden === true);

    // B：店家未命中時，仍保留同一顆「用店家搜尋其他卡片」按鈕。
    d.getElementById('merchantChoice').value = '不存在的店家 XYZ';
    w.calculate();
    await sleep(50);
    check('店家未命中時，只有特店方案的卡片仍以基本回饋列入候選', w.eval("lastStoreOffers.some(o=>o.card.id==='esun_kuma' && o.plan.name==='基本回饋' && o.matchedParts.length===0 && o.base>0)"), w.eval("JSON.stringify(lastStoreOffers.map(o=>({card:o.card.name,plan:o.plan.name,base:o.base,bonus:o.bonus})))"));
    check('店家未命中時仍保留用店家搜尋其他卡片按鈕', merchantOpen.hidden === false);
    check('未命中時特約彈窗尚未自動打開', merchantTrigger.hidden === true);
    merchantOpen.click();
    await sleep(50);
    check('未命中時點按鈕可打開特約彈窗', merchantTrigger.hidden === false && /不存在的店家 XYZ/.test(d.getElementById('resultMerchantFeedback').textContent), d.getElementById('resultMerchantFeedback').textContent);
    var kumaBaseChip = d.querySelector('#resultMerchantList [data-result-merchant-card="esun_kuma"] small');
    check('店家未命中時，基本回饋候選不誤標為特約命中', !!kumaBaseChip && /實體一般/.test(kumaBaseChip.textContent) && !/特約命中/.test(kumaBaseChip.textContent), kumaBaseChip ? kumaBaseChip.textContent : '沒有玉山熊本熊卡');
    w.clearMerchantLookupConditions();
    await sleep(40);

    // 快捷標籤也要沿用同一個店家狀態，不能按了唐吉訶德卻還帶著上一家店
    w.applyPreset('donki', null);
    await sleep(40);
    check('店家快捷標籤會把已知店家帶進試算', d.getElementById('merchantChoice').value === '唐吉訶德' && /唐吉訶德/.test(d.getElementById('memo').value));
    check('目前推薦命中時仍保留單一找特約卡片入口', merchantOpen.hidden === false);
    check('目前推薦命中時特約彈窗保持收起', merchantTrigger.hidden === true, String(merchantTrigger.hidden));
    w.clearMerchantLookupConditions();
    await sleep(30);
    check('清除後找特約卡片入口仍在', merchantOpen.hidden === false);
    check('清除後特約彈窗保持收起', merchantTrigger.hidden === true);
    w.switchTab('guide'); await sleep(50);
    check('攻略頁不再有商店總覽', !d.getElementById('guideMerchantOverview') && !d.getElementById('guideMerchantList'));
    check('攻略頁特約店家歸屬在加碼活動底下', d.querySelectorAll('#guideCardList .guide-bonus-item .guide-bonus-merchants').length > 0 && /特約店家/.test(d.querySelector('#guideCardList .guide-bonus-merchants').textContent));
    check('攻略頁特約店家直接顯示原文，不拆成 chip', !d.querySelector('#guideCardList .guide-bonus-merchant-chip') && !!d.querySelector('#guideCardList .guide-bonus-merchant-text') && /松本清/.test(d.querySelector('#guideCardList .guide-bonus-merchant-text').textContent));
    w.switchTab('decision'); await sleep(50);

    // 拆刷模式用 tab 切換，不用 radio 或下拉選單
    var splitTabs = d.querySelectorAll('.split-mode-tabs [role="tab"]');
    check('拆刷模式用 tab 呈現，不是 radio 或下拉選單', splitTabs.length === 2 && !d.querySelector('input[name="splitModeChoice"]') && !d.querySelector('select#splitMode'), splitTabs.length + ' 個 tab');
    check('拆刷模式 tab 文字直接可見', /拆分最佳化/.test(splitTabs[0].textContent) && /整筆刷/.test(splitTabs[1].textContent));
    check('拆刷模式 tab 觸控高度 >= 44px', splitTabs[0].getBoundingClientRect().height >= 44, splitTabs[0].getBoundingClientRect().height + 'px');
    check('拆刷模式預設為拆分最佳化', d.getElementById('splitModeAuto').getAttribute('aria-selected') === 'true' && d.getElementById('splitModeAuto').classList.contains('active') && d.getElementById('splitMode').value === 'auto' && /拆分最佳化/.test(d.getElementById('splitModeHint').textContent));
    d.getElementById('splitModeSingle').click();
    await sleep(30);
    check('切到整筆刷會同步 hidden 值與選中狀態', d.getElementById('splitModeSingle').getAttribute('aria-selected') === 'true' && d.getElementById('splitModeAuto').getAttribute('aria-selected') === 'false' && d.getElementById('splitMode').value === 'single');
    check('切到整筆刷會更新模式說明', /整筆刷/.test(d.getElementById('splitModeHint').textContent));
    d.getElementById('splitModeAuto').click();
    await sleep(30);
    check('切回拆分最佳化會同步 hidden 值與選中狀態', d.getElementById('splitModeAuto').getAttribute('aria-selected') === 'true' && d.getElementById('splitModeSingle').getAttribute('aria-selected') === 'false' && d.getElementById('splitMode').value === 'auto');

    // 特約拆刷：原文照原本方式各自掛在推薦方案底下，查詢按鈕仍只有一顆
    w.setDecisionContexts(['merchant']);
    d.getElementById('jpyAmount').value = '50000';
    d.getElementById('jpyAmount').dispatchEvent(new w.Event('input', {bubbles:true}));
    await sleep(120);
    var splitAllocations = w.eval('currentDecision.v3Allocations.length');
    var splitPlanBlocks = d.querySelectorAll('#cardDesc .split-card-plan');
    var splitMerchantBlocks = d.querySelectorAll('#cardDesc .result-plan-merchant');
    check('特約拆刷時每個推薦方案底下都有原文區塊', splitAllocations >= 2 && splitPlanBlocks.length === splitAllocations && splitMerchantBlocks.length === splitAllocations, 'allocations=' + splitAllocations + ', plans=' + splitPlanBlocks.length + ', merchants=' + splitMerchantBlocks.length);
    check('特約拆刷原文各自掛在方案底下', Array.from(splitPlanBlocks).every(function(plan){ return !!plan.querySelector('.result-plan-merchant'); }));
    var splitTextDetails = d.querySelectorAll('#cardDesc details.result-plan-merchant');
    check('特約拆刷原文預設收合', splitTextDetails.length >= 1 && Array.from(splitTextDetails).every(function(el){ return el.open === false; }));
    var splitDetailPreview = splitTextDetails[0] && splitTextDetails[0].querySelector('.result-plan-merchant-preview');
    check('特約拆刷原文摘要直接可見', !!splitDetailPreview && /松本清/.test(splitDetailPreview.textContent), splitDetailPreview ? splitDetailPreview.textContent.slice(0, 60) : '沒有摘要');
    check('特約拆刷未限制店家的方案直接顯示實體一般消費', !!d.querySelector('#cardDesc .result-plan-merchant.is-empty') && /未限制店家/.test(d.querySelector('#cardDesc .result-plan-merchant.is-empty').textContent));
    check('特約拆刷仍只有一顆查詢按鈕且在明細下方', d.querySelectorAll('.result-merchant-open').length === 1 && d.getElementById('cardDesc').nextElementSibling === merchantOpen);
    merchantOpen.click();
    await sleep(50);
    check('特約拆刷的彈窗只保留搜尋欄與結果', !!d.getElementById('resultMerchantSearch') && !d.getElementById('resultMerchantRaw') && !d.getElementById('resultMerchantMemoBox'));
    var splitSearch = d.getElementById('resultMerchantSearch');
    splitSearch.value = '松本清';
    splitSearch.dispatchEvent(new w.Event('input', {bubbles:true}));
    await sleep(140);
    var splitFeedbackText = d.getElementById('resultMerchantFeedback').textContent;
    var splitHitChip = Array.from(d.querySelectorAll('#resultMerchantList .merchant-card-button small')).find(function (el) { return /特約命中/.test(el.textContent); });
    check('特約拆刷搜尋也直接標出打中的關鍵字', /搜尋「松本清」/.test(splitFeedbackText) && !!splitHitChip && /特約命中「松本清」/.test(splitHitChip.textContent), splitFeedbackText + ' / ' + (splitHitChip ? splitHitChip.textContent : '沒有命中卡片'));
    check('特約拆刷搜尋結果有候選卡片', d.querySelectorAll('#resultMerchantList .merchant-card-chip').length >= 1, d.querySelectorAll('#resultMerchantList .merchant-card-chip').length + ' 張');
    w.closeMerchantLookupPanel();
    await sleep(30);

    // 分頁正常
    ['decision','quotas','ledger','guide'].forEach(function(t){ w.switchTab(t); });
    check('四個分頁切換正常', true);
    check('無 JS 錯誤', errs.length === 0, errs.slice(0,3).join('; '));
  } catch (e) { fail++; log('EXCEPTION: ' + e.message + ' | ' + (e.stack||'').split('\n')[1]); }
  log(''); log('=== ' + pass + ' passed, ' + fail + ' failed ===');
  var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}, 2600);
</script>
