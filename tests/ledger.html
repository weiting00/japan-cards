<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
// 記帳明細與雲端同步契約測試
// 清空 / 刪除明細後，送出的雲端 payload 必須已反映新狀態；
// 否則下一次 pull 會把舊明細拉回來，使用者會覺得「清不掉」。
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
setTimeout(async function () {
  var out = []; var log = function (m) { out.push(m); }; var pass = 0, fail = 0;
  function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
  function finish() {
    log(''); log('=== ' + pass + ' passed, ' + fail + ' failed ===');
    var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  }
  try {
    var frame = document.getElementById('f');
    var w = frame.contentWindow, d = w.document;
    var ev = function (code) { return w.eval(code); };
    var errs = []; w.addEventListener('error', function(e){ errs.push(e.message); });

    // 固定初始狀態，避免其他測試殘留資料影響
    w.localStorage.clear();
    w.location.reload();
    await sleep(1600);
    w = frame.contentWindow; d = w.document;

    var ids = ev('(function(){var c=rulesV3.cards[0],p=c.plans[0],x=p.rewardParts[0];return {cardId:c.id,planId:p.id,partId:x.id,cardName:c.name,planName:p.name};})()');

    // 攔截雲端寫入，不真的打 Supabase；保留實際 pushToCloud 流程
    ev('window.__cloudWrites = []; currentRoom = "TEST-LEDGER"; writeCloudRoom = async function(room, payload){ window.__cloudWrites.push(JSON.parse(JSON.stringify(payload))); return {ok:true}; };');

    function makeLedger(id, withUsage) {
      return {
        id: id,
        date: '11/09 12:00',
        memo: '同步測試 ' + id,
        cardKey: 'v3-' + ids.cardId,
        physicalCardId: ids.cardId,
        v3PlanId: ids.planId,
        cardName: ids.cardName,
        jpy: 1000,
        twd: 209,
        rewardTwd: 10,
        ruleSnapshot: { v3: true, planName: ids.planName },
        v3Usage: withUsage ? [{ partId: ids.partId, amount: 10 }] : []
      };
    }
    function setLedger(item) {
      ev('ledger = ' + JSON.stringify([item]) + '; ledgerRevision++; localStorage.setItem("japan_card_ledger_v2", JSON.stringify(ledger)); renderLedger();');
    }
    function lastWrite() {
      var writes = ev('window.__cloudWrites');
      return writes && writes.length ? writes[writes.length - 1] : null;
    }
    function setPartUsed(value) {
      ev('rulesV3.cards.find(function(c){return c.id===' + JSON.stringify(ids.cardId) + ';}).plans.find(function(p){return p.id===' + JSON.stringify(ids.planId) + ';}).rewardParts.find(function(x){return x.id===' + JSON.stringify(ids.partId) + ';}).usedReward=' + Number(value) + ';');
    }
    function partUsedFrom(payload) {
      if (!payload || !payload.cardRulesV3) return null;
      var card = (payload.cardRulesV3.cards || []).find(function(c){ return c.id === ids.cardId; });
      var plan = card && (card.plans || []).find(function(p){ return p.id === ids.planId; });
      var part = plan && (plan.rewardParts || []).find(function(x){ return x.id === ids.partId; });
      return part ? Number(part.usedReward) || 0 : null;
    }
    function partCumulativeFrom(payload) {
      if (!payload || !payload.cardRulesV3) return null;
      var card = (payload.cardRulesV3.cards || []).find(function(c){ return c.id === ids.cardId; });
      var plan = card && (card.plans || []).find(function(p){ return p.id === ids.planId; });
      var part = plan && (plan.rewardParts || []).find(function(x){ return x.id === ids.partId; });
      return part ? Number(part.cumulativeSpendTwd) || 0 : null;
    }
    function partState() {
      return ev('(function(){var c=rulesV3.cards.find(function(c){return c.id===' + JSON.stringify(ids.cardId) + ';});var p=c.plans.find(function(p){return p.id===' + JSON.stringify(ids.planId) + ';});var x=p.rewardParts.find(function(x){return x.id===' + JSON.stringify(ids.partId) + ';});return {used:Number(x.usedReward)||0,cumulative:Number(x.cumulativeSpendTwd)||0,periodKey:x.periodKey||null};})()');
    }
    function setPartPeriod(used, cumulative, periodKey) {
      ev('(function(){var c=rulesV3.cards.find(function(c){return c.id===' + JSON.stringify(ids.cardId) + ';});var p=c.plans.find(function(p){return p.id===' + JSON.stringify(ids.planId) + ';});var x=p.rewardParts.find(function(x){return x.id===' + JSON.stringify(ids.partId) + ';});x.cycle="month";x.capAmount=1000;x.usedReward=' + Number(used) + ';x.cumulativeSpendTwd=' + Number(cumulative) + ';x.periodKey=' + JSON.stringify(periodKey) + ';x.cumulativePeriodKey=' + JSON.stringify(periodKey) + ';})()');
    }

    // ---------- 1. 清除明細直接生效，不再開確認視窗 ----------
    check('清空明細不再有確認 modal', !d.getElementById('clearLedgerModal') && typeof w.confirmClearLedger === 'undefined');
    setLedger(makeLedger(9001, false));
    ev('window.__cloudWrites = [];');
    w.clearLedger();
    await sleep(250);
    var writeKeep = lastWrite();
    check('清除明細後有送出雲端更新', !!writeKeep, writeKeep ? '有 payload' : '沒有 payload');
    check('清除明細後推送的 ledger 是空的', !!writeKeep && Array.isArray(writeKeep.ledger) && writeKeep.ledger.length === 0, writeKeep ? 'len=' + (writeKeep.ledger || []).length : '無');

    // 舊雲端快照（ledgerUpdatedAt 較舊）不可復活已清空的明細
    ev('readCloudRoom = async function(){ return { response:{}, value:{ updatedAt: 1, ledgerUpdatedAt: 1, cardRulesV3: JSON.parse(JSON.stringify(rulesV3)), ledger: ' + JSON.stringify([makeLedger(9000, false)]) + ' }, notFound:false }; }; window.__cloudWrites = [];');
    await w.pullFromCloud(true);
    await sleep(250);
    var writeAfterPull = lastWrite();
    check('舊雲端明細不會蓋掉本地已清空狀態', ev('ledger').length === 0, 'len=' + ev('ledger').length);
    check('偵測到雲端明細較舊後會回推本地空明細', !!writeAfterPull && Array.isArray(writeAfterPull.ledger) && writeAfterPull.ledger.length === 0, writeAfterPull ? 'len=' + (writeAfterPull.ledger || []).length : '無');

    // ---------- 2. 清除明細時一定連動重置額度 ----------
    setPartUsed(50);
    setLedger(makeLedger(9002, true));
    ev('window.__cloudWrites = [];');
    w.clearLedger();
    await sleep(250);
    var writeReset = lastWrite();
    check('清除明細後有送出雲端更新', !!writeReset, writeReset ? '有 payload' : '沒有 payload');
    check('清除明細後推送的 ledger 是空的', !!writeReset && Array.isArray(writeReset.ledger) && writeReset.ledger.length === 0, writeReset ? 'len=' + (writeReset.ledger || []).length : '無');
    check('清除明細後推送的 usedReward 已歸零', partUsedFrom(writeReset) === 0, String(partUsedFrom(writeReset)));
    check('清除明細後本地 usedReward 也已歸零', ev('rulesV3.cards.find(function(c){return c.id===' + JSON.stringify(ids.cardId) + ';}).plans.find(function(p){return p.id===' + JSON.stringify(ids.planId) + ';}).rewardParts.find(function(x){return x.id===' + JSON.stringify(ids.partId) + ';}).usedReward') === 0, String(ev('rulesV3.cards.find(function(c){return c.id===' + JSON.stringify(ids.cardId) + ';}).plans.find(function(p){return p.id===' + JSON.stringify(ids.planId) + ';}).rewardParts.find(function(x){return x.id===' + JSON.stringify(ids.partId) + ';}).usedReward')));

    // ---------- 3. 刪除單筆明細：先更新 ledger / 額度，再推同步 ----------
    setPartUsed(50);
    setLedger(makeLedger(9003, true));
    ev('showAppDialog = function(){ return Promise.resolve(true); }; window.__cloudWrites = [];');
    w.deleteLedgerItem(9003);
    await sleep(300);
    var writeDelete = lastWrite();
    check('刪除單筆後有送出雲端更新', !!writeDelete, writeDelete ? '有 payload' : '沒有 payload');
    check('刪除單筆後本地 ledger 清空', ev('ledger').length === 0, 'len=' + ev('ledger').length);
    check('刪除單筆後推送的 ledger 是空的（不是刪除前的舊資料）', !!writeDelete && Array.isArray(writeDelete.ledger) && writeDelete.ledger.length === 0, writeDelete ? 'len=' + (writeDelete.ledger || []).length : '無');
    check('刪除單筆後推送的 usedReward 已返還', partUsedFrom(writeDelete) === 40, String(partUsedFrom(writeDelete)));

    // ---------- 4. 編輯單筆明細：同週期不改額度；跨週期做差值調整 ----------
    var pad2 = function (n) { return String(n).padStart(2, '0'); };
    var tp = ev('getTaipeiDateParts()');
    var currentPeriodKey = tp.year + '-' + pad2(tp.month);
    var sameMonthDate = tp.year + '-' + pad2(tp.month) + '-09T12:00';
    var sameMonthOtherDate = tp.year + '-' + pad2(tp.month) + '-08T08:30';
    var previousYear = tp.month === 1 ? tp.year - 1 : tp.year;
    var previousMonth = tp.month === 1 ? 12 : tp.month - 1;
    var previousMonthDate = previousYear + '-' + pad2(previousMonth) + '-09T12:00';

    setPartPeriod(50, 500, currentPeriodKey);
    ev('saveRulesV3(false);');
    var editItem = makeLedger(9004, true);
    editItem.date = pad2(tp.month) + '/09 12:00';
    editItem.dateISO = sameMonthDate;
    editItem.v3Usage[0].cumulativeSpendTwd = 100;
    setLedger(editItem);
    ev('window.__cloudWrites = [];');
    w.openLedgerEdit(9004);
    await sleep(30);
    var editModal = d.getElementById('ledgerEditModal');
    check('點編輯會開啟明細編輯 modal', editModal.style.display === 'flex');
    check('編輯 modal 會帶入目前名稱', d.getElementById('ledgerEditMemo').value === '同步測試 9004', d.getElementById('ledgerEditMemo').value);
    check('編輯 modal 會帶入目前日期', d.getElementById('ledgerEditDate').value === sameMonthDate, d.getElementById('ledgerEditDate').value);
    d.getElementById('ledgerEditMemo').value = '改後名稱';
    d.getElementById('ledgerEditDate').value = sameMonthOtherDate;
    w.saveLedgerEdit();
    await sleep(300);
    var edited = ev('ledger[0]');
    check('儲存後名稱已更新', edited.memo === '改後名稱', edited.memo);
    check('儲存後日期已更新', edited.date === pad2(tp.month) + '/08 08:30', edited.date);
    check('儲存後保留 dateISO 供下次編輯', edited.dateISO === sameMonthOtherDate, edited.dateISO);
    var writeEdit = lastWrite();
    check('編輯明細後有送出雲端更新', !!writeEdit && writeEdit.ledger[0].memo === '改後名稱' && writeEdit.ledger[0].date === pad2(tp.month) + '/08 08:30', writeEdit ? JSON.stringify(writeEdit.ledger[0]) : '無');
    check('同一週期內編輯日期與名稱不會重算額度', partUsedFrom(writeEdit) === 50, String(partUsedFrom(writeEdit)));
    check('同一週期內編輯日期不會重算累積消費', partCumulativeFrom(writeEdit) === 500, String(partCumulativeFrom(writeEdit)));
    check('儲存後編輯 modal 會關閉', editModal.style.display === 'none');

    // 移到上一個週期：目前額度要把這筆用量扣回來
    w.openLedgerEdit(9004);
    await sleep(20);
    d.getElementById('ledgerEditDate').value = previousMonthDate;
    w.saveLedgerEdit();
    await sleep(300);
    var stateOut = partState();
    check('日期移出目前週期會扣回加碼用量', stateOut.used === 40, JSON.stringify(stateOut));
    check('日期移出目前週期會扣回累積消費', stateOut.cumulative === 400, JSON.stringify(stateOut));
    var writeOut = lastWrite();
    check('移出週期後雲端 usedReward 同步', partUsedFrom(writeOut) === 40, String(partUsedFrom(writeOut)));
    check('移出週期後雲端累積消費同步', partCumulativeFrom(writeOut) === 400, String(partCumulativeFrom(writeOut)));
    check('移出週期後明細日期已更新', ev('ledger[0]').dateISO === previousMonthDate, ev('ledger[0]').dateISO);

    // 再移回目前週期：用量要加回來
    w.openLedgerEdit(9004);
    await sleep(20);
    d.getElementById('ledgerEditDate').value = sameMonthDate;
    w.saveLedgerEdit();
    await sleep(300);
    var stateIn = partState();
    check('日期移回目前週期會加回加碼用量', stateIn.used === 50, JSON.stringify(stateIn));
    check('日期移回目前週期會加回累積消費', stateIn.cumulative === 500, JSON.stringify(stateIn));

    // 再次移出後刪除：不能重複扣一次已不在目前週期的用量
    w.openLedgerEdit(9004);
    await sleep(20);
    d.getElementById('ledgerEditDate').value = previousMonthDate;
    w.saveLedgerEdit();
    await sleep(300);
    ev('showAppDialog = function(){ return Promise.resolve(true); }; window.__cloudWrites = [];');
    w.deleteLedgerItem(9004);
    await sleep(300);
    var stateDeleteOut = partState();
    check('刪除已移出週期的明細不會重複扣額度', stateDeleteOut.used === 40, JSON.stringify(stateDeleteOut));
    check('刪除已移出週期的明細不會重複扣累積消費', stateDeleteOut.cumulative === 400, JSON.stringify(stateDeleteOut));

    // 舊明細只有「月/日 下午時:分」時，也要能帶入編輯欄位
    ev('ledger=[{id:9005,date:"11/09 下午02:30",memo:"舊格式",cardKey:"backup",cardName:"舊卡",jpy:1000,twd:209,rewardTwd:10,ruleSnapshot:{v3:true}}]; renderLedger();');
    w.openLedgerEdit(9005);
    await sleep(20);
    check('舊明細的下午時間可正確帶入編輯欄位', d.getElementById('ledgerEditDate').value.endsWith('T14:30'), d.getElementById('ledgerEditDate').value);
    w.closeLedgerEdit();

    check('無 JS 錯誤', errs.length === 0, errs.slice(0,3).join('; '));
  } catch (e) { fail++; log('EXCEPTION: ' + e.message + ' | ' + (e.stack||'').split('\n')[1]); }
  finish();
}, 2600);
</script>
