<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#000}iframe{border:0;display:block;width:390px;height:844px}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
var mode = (location.hash || '#guide').slice(1);
setTimeout(function () {
  var w = document.getElementById('f').contentWindow, d = w.document;
  if (mode === 'editor') {
    var id = w.eval('rulesV3.cards.find(c=>c.plans.length).id');
    w.openCardEditor(id);
    setTimeout(function () { d.getElementById('cardEditorAddActivity').click(); }, 300);
  } else if (mode === 'addcard') {
    w.openAddCard();
  } else if (mode === 'calc') {
    d.getElementById('jpyAmount').value = '50000';
    w.eval('calculate()');
  }
}, 2500);
</script>
