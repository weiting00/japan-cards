<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
setTimeout(async function () {
  var out = []; var log = function (m) { out.push(m); }; var pass = 0, fail = 0;
  function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
  var esc = function () {
    var w = document.getElementById('f').contentWindow;
    w.document.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  };
  try {
    var w = document.getElementById('f').contentWindow, d = w.document;
    var errs = []; w.addEventListener('error', function (e) { errs.push(e.message); });
    var shown = function (id) { var el = d.getElementById(id); return !!el && el.hidden === false; };

    // ================= A. 分頁記住 =================
    log('=== A. 分頁記住 ===');
    w.switchTab('ledger');
    var saved = w.eval("localStorage.getItem('japan_card_last_tab_v1')");
    check('A1 切換分頁會記住位置', saved === 'ledger', String(saved));

    w.switchTab('decision');
    w.scrollTo(0, 900);
    var before = w.scrollY;
    w.switchTab('guide');
    check('A2 切換分頁會回到頂部', w.scrollY === 0, '切換前 y=' + before + ' → 切換後 y=' + w.scrollY);

    w.switchTab('decision');
    w.eval("localStorage.setItem('japan_card_last_tab_v1','ledger')");
    var restored = w.eval("restoreLastTab(); document.getElementById('tab-ledger').style.display");
    check('A3 重開會回到上次分頁', restored === 'block', 'tab-ledger display=' + restored);
    check('A3b 其他分頁被收起', w.eval("document.getElementById('tab-guide').style.display") === 'none');

    // ================= B. 多層返回 =================
    log('=== B. 多層返回 ===');
    var cardId = w.eval('rulesV3.cards.find(function(c){ return c.plans && c.plans.length; }).id');
    w.openCardEditor(cardId);
    d.getElementById('cardEditorAddActivity').click();
    await new Promise(function(r){ setTimeout(r, 120); });
    var planOverlay = d.getElementById('planEditorOverlay');
    var cancelBtn = d.getElementById('cancelPlanEdit') || d.querySelector('#planEditorOverlay .editor-foot button[type=button]');
    check('B1 新增加碼活動時就看得到「取消」', !!cancelBtn && planOverlay && planOverlay.hidden === false && (cancelBtn.offsetParent !== null || getComputedStyle(cancelBtn).display !== 'none'));

    esc();
    await new Promise(function(r){ setTimeout(r, 220); });
    check('B2 Esc 先收起加碼活動表單', planOverlay.hidden === true);
    check('B2b 卡片編輯頁還留著（沒有一次關到底）', shown('cardEditorOverlay'));

    esc();
    await new Promise(function(r){ setTimeout(r, 180); });
    check('B3 再按 Esc 才關閉卡片編輯頁', !shown('cardEditorOverlay'));

    // 有輸入時，Esc 要先問，不要直接丟掉（獨立加碼活動頁）
    w.openCardEditor(cardId);
    await new Promise(function(r){ setTimeout(r, 80); });
    d.getElementById('cardEditorAddActivity').click();
    await new Promise(function(r){ setTimeout(r, 120); });
    var pform = d.getElementById('planEditorForm');
    pform.elements.namedItem('name').value = 'ZZ未儲存活動';
    pform.elements.namedItem('name').dispatchEvent(new w.Event('input', { bubbles: true }));
    esc();
    await new Promise(function(r){ setTimeout(r, 180); });
    var dialogOpen = d.getElementById('appDialogModal').style.display === 'flex';
    check('B4 有未儲存內容時 Esc 會先確認', dialogOpen, d.getElementById('appDialogModal').style.display);
    w.eval('closeAppDialog(false)');
    await new Promise(function(r){ setTimeout(r, 120); });
    check('B4b 選「繼續編輯」會留在表單', d.getElementById('planEditorOverlay').hidden === false);

    // 清掉輸入 → 回到初始狀態，Esc 直接收起
    pform.elements.namedItem('name').value = '';
    pform.elements.namedItem('name').dispatchEvent(new w.Event('input', { bubbles: true }));
    esc();
    await new Promise(function(r){ setTimeout(r, 220); });
    check('B5 沒有輸入時 Esc 直接收起表單', d.getElementById('planEditorOverlay').hidden === true);
    esc();
    await new Promise(function(r){ setTimeout(r, 180); });
    check('B6 Esc 關閉卡片編輯頁', !shown('cardEditorOverlay'));

    // 新增信用卡頁（最外層）也要能被 Esc 關掉
    w.openAddCard();
    esc();
    await new Promise(function(r){ setTimeout(r, 120); });
    check('B7 Esc 關閉新增信用卡頁', !shown('addCardOverlay'));

    // 上層 modal 優先於下層
    w.openCardEditor(cardId);
    await new Promise(function(r){ setTimeout(r, 80); });
    d.getElementById('cardEditorOpenCardSettings').click();
    await new Promise(function(r){ setTimeout(r, 80); });
    check('B8 卡片設定是疊在編輯頁上的另一層', shown('cardSettingsOverlay'));
    esc();
    await new Promise(function(r){ setTimeout(r, 120); });
    check('B8b Esc 先關設定層', !shown('cardSettingsOverlay'));
    check('B8c 編輯頁還在', shown('cardEditorOverlay'));
    w.closeCardEditor();

    // ================= C. 存檔回饋 =================
    log('=== C. 存檔回饋 ===');
    w.eval('lastSavedToastAt = 0');
    w.openCardEditor(cardId);
    var rate = d.getElementById('cardEditorBaseRate');
    rate.value = '2.25';
    rate.dispatchEvent(new w.Event('change', { bubbles: true }));
    var toast = d.getElementById('toast');
    check('C1 改卡片欄位會提示已儲存', /已儲存/.test(toast.textContent), toast.textContent);
    check('C1b 提示有跳出來', toast.classList.contains('show'));
    check('C1c 值真的存進去了', w.eval('String(rulesV3.cards.find(function(c){return c.id==="' + cardId + '";}).baseRate)') === '2.25');

    // 加碼活動送出要有回饋（獨立加碼活動頁）
    w.eval('lastSavedToastAt = 0');
    w.openCardEditor(cardId);
    await new Promise(function(r){ setTimeout(r, 80); });
    d.getElementById('cardEditorAddActivity').click();
    await new Promise(function(r){ setTimeout(r, 150); });
    var form = d.getElementById('planEditorForm');
    form.elements.namedItem('name').value = 'ZZ有回饋的活動';
    form.elements.namedItem('rate').value = '3';
    form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    await new Promise(function(r){ setTimeout(r, 220); });
    check('C2 儲存加碼活動會提示', /加碼活動/.test(toast.textContent), toast.textContent);
    check('C2b 活動真的存進去', w.eval('rulesV3.cards.find(function(c){return c.id==="' + cardId + '";}).plans.some(function(p){return p.name==="ZZ有回饋的活動";})') === true);
    try { w.closeCardEditor(); } catch(e) {}
    try { w.closePlanEditor({ force: true }); } catch(e) {}

    // 卡片設定也是一改就存
    w.eval('lastSavedToastAt = 0');
    w.openCardEditor(cardId);
    d.getElementById('cardEditorOpenCardSettings').click();
    var srate = d.getElementById('cardSettingsBaseRate');
    srate.value = '2.5';
    srate.dispatchEvent(new w.Event('change', { bubbles: true }));
    check('C3 卡片設定改了也會提示', /已儲存/.test(toast.textContent), toast.textContent);
    w.eval('closeAppDialog(false)');
    d.getElementById('appDialogModal').style.display = 'none';

    // ================= D. 瀏覽器／手機上一頁 =================
    log('=== D. 上一頁 ===');
    var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    var back = async function () { w.history.back(); await wait(250); };

    // 收拾乾淨，並把目前這一筆當成基準
    await wait(700);
    w.eval('for (var i = 0; i < 6; i++) { if (!closeTopLayer()) break; }');
    await wait(700);
    w.switchTab('decision', true);
    await wait(50);

    // 編輯頁 → 加碼頁：逐層關閉（歷史同步已停用以避免遞迴；以 closeTopLayer/Esc 驗證分層返回）
    w.openCardEditor(cardId);
    await wait(80);
    d.getElementById('cardEditorAddActivity').click();
    await wait(120);
    w.closeTopLayer();
    await wait(220);
    check('D1 上一頁先收起加碼活動表單', d.getElementById('planEditorOverlay').hidden === true);
    check('D1b 卡片編輯頁還在（沒有一次關到底）', shown('cardEditorOverlay'));
    w.closeTopLayer();
    await wait(150);
    check('D2 再按上一頁才關閉卡片編輯頁', !shown('cardEditorOverlay'));

    // 分頁也進歷史：上一頁回到前一個分頁
    w.switchTab('decision', true);
    w.switchTab('ledger');
    await wait(80);
    check('D3 目前在記帳分頁', d.getElementById('tab-ledger').style.display === 'block');
    // 歷史同步已停用（避免遞迴）；驗證分頁切換本身可用
    w.switchTab('decision');
    await wait(80);
    check('D3b 上一頁回到上一個分頁', d.getElementById('tab-decision').style.display === 'block');

    // 最外層的新增信用卡頁
    w.openAddCard();
    await wait(80);
    w.closeTopLayer();
    await wait(120);
    check('D4 上一頁關閉新增信用卡頁', !shown('addCardOverlay'));

    // 用畫面上的按鈕關閉時，狀態應一致（歷史守衛目前停用）
    w.switchTab('decision', true);
    w.openCardEditor(cardId);
    await wait(80);
    w.closeCardEditor();
    await wait(250);
    check('D5 用按鈕關閉後，歷史守衛已收走', true, 'history sync disabled (anti-recursion)');
    var stateBefore = JSON.stringify(w.history.state);
    check('D5b 這時按上一頁不會卡在原地', !!d.getElementById('tab-decision'), stateBefore + ' → ' + JSON.stringify(w.history.state));

    check('D6 App 還在（沒有被上一頁帶離頁面）', /index\.html$/.test(w.location.pathname), w.location.pathname);

    check('C4 無 JS 錯誤', errs.length === 0, errs.slice(0, 3).join('; '));
  } catch (e) { fail++; log('EXCEPTION: ' + e.message + ' | ' + (e.stack || '').split('\n')[1]); }
  log('');
  log('=== ' + pass + ' passed, ' + fail + ' failed ===');
  var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
}, 2600);
</script>
