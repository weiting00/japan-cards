<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#111}iframe{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="../index.html"></iframe>
<script>
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
setTimeout(async function () {
  var out = []; var log = function (m) { out.push(m); }; var pass = 0, fail = 0;
  function check(n, c, e) { if (c) { pass++; log('PASS  ' + n + (e ? ' — ' + e : '')); } else { fail++; log('FAIL  ' + n + (e ? ' — ' + e : '')); } }
  function finish() {
    log(''); log('=== ' + pass + ' passed, ' + fail + ' failed ===');
    var pre = document.createElement('pre'); pre.id = 'AUDIT'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  }
  try {
    var w = document.getElementById('f').contentWindow, d = w.document;
    var ev = function (code) { return w.eval(code); };
    var errs = []; w.addEventListener('error', function(e){ errs.push(e.message); });
    var confirmDialog = function () { d.getElementById('appDialogConfirm').click(); };

    // ---------- 1. legacy 資料源必須完全消失 ----------
    check('legacy cardRules 已移除', typeof w.cardRules === 'undefined');
    check('legacy limits 已移除', typeof w.limits === 'undefined');
    check('legacy quotas 已移除', typeof w.quotas === 'undefined');
    check('legacy quotaPeriods 已移除', typeof w.quotaPeriods === 'undefined');
    check('legacy quotaResetAt 已移除', typeof w.quotaResetAt === 'undefined');
    check('legacy getRule 已移除', typeof w.getRule === 'undefined');
    check('legacy getNetRate 已移除', typeof w.getNetRate === 'undefined');
    check('legacy renderRuleGuideTable 已移除', typeof w.renderRuleGuideTable === 'undefined');
    check('legacy updateQuotaUI 已移除', typeof w.updateQuotaUI === 'undefined');
    check('legacy recordSplitPlan 已移除', typeof w.recordSplitPlan === 'undefined');
    check('legacy 規則表 DOM 已移除', !d.getElementById('ruleGuideRows') && !d.getElementById('toggleRuleEdit') && !d.getElementById('ruleChangeModal'));
    check('legacy 門檻提示 DOM 已移除', !d.getElementById('quotaThresholdOpportunity') && !d.getElementById('splitRecordActions'));

    // ---------- 2. rulesV3 是唯一真相 ----------
    var R = ev('rulesV3');
    check('rulesV3 存在且有卡片', !!(R && R.cards && R.cards.length), R && R.cards.length + ' 張');
    check('rulesV3 有 plans 與 rewardParts', !!(R.cards[0].plans[0].rewardParts));
    check('內建種子含 4 張卡', R.cards.length === 4, R.cards.map(function(c){return c.id;}).join(','));

    // ---------- 3. localStorage 不再寫入 legacy key ----------
    var lsKeys = Object.keys(w.localStorage);
    var legacyKeys = lsKeys.filter(function(k){ return /japan_card_(rules_v2|limits|quotas|quota_periods|quota_reset_at|rules_updated_at|rule_context)/.test(k); });
    check('localStorage 無 legacy key', legacyKeys.length === 0, legacyKeys.join(',') || '(無)');
    check('localStorage 有 rulesV3', lsKeys.indexOf('japan_card_rules_v3') >= 0);

    // ---------- 4. 額度看板 (v3-native) ----------
    w.switchTab('quotas');
    var qRoot = d.getElementById('quotaCards');
    var qText = qRoot.textContent.replace(/\s+/g,' ');
    check('額度看板有內容', qRoot.querySelectorAll('.quota-item').length > 0, qRoot.querySelectorAll('.quota-item').length + ' 筆');
    check('額度看板顯示 卡片·方案·項目', /富邦 J 卡 · 富邦 J 卡 \(交通卡 AP 儲值\)/.test(qText), qText.slice(0,70));
    check('額度看板顯示 已用/剩餘/上限', /已用 NT\$/.test(qText) && /剩餘 NT\$/.test(qText));
    check('額度看板有重置鈕', qRoot.querySelectorAll('[data-v3-reset]').length > 0, qRoot.querySelectorAll('[data-v3-reset]').length + ' 顆');
    check('額度看板有週期標籤', /自動重置|手動重置|活動期間/.test(qText), (qText.match(/[^ ]*(自動重置|手動重置|活動期間)[^ ]*/)||[''])[0]);
    check('額度看板含 玉山熊本熊', /玉山熊本熊卡/.test(qText));
    check('額度看板顯示下次重置日', /下次 \d{4}-\d{2}-\d{2}|下次 手動重置/.test(qText), (qText.match(/下次 [^已]*/)||[''])[0]);

    // ---------- 5. 單項重置 (v3) ----------
    var part = ev('rulesV3').cards[0].plans[0].rewardParts[0];
    part.usedReward = 50;
    w.renderQuotaCards();
    check('重置前顯示已用 50', /已用 NT\$50/.test(d.getElementById('quotaCards').textContent.replace(/\s+/g,' ')));
    d.querySelector('#quotaCards [data-v3-reset]').click();
    check('重置確認框有開啟', d.getElementById('quotaResetModal').style.display === 'flex');
    w.confirmQuotaReset();
    check('單項重置後 usedReward 歸零', ev('rulesV3').cards[0].plans[0].rewardParts[0].usedReward === 0, 'usedReward=' + ev('rulesV3').cards[0].plans[0].rewardParts[0].usedReward);
    check('重置框已關閉', d.getElementById('quotaResetModal').style.display === 'none');

    // ---------- 6. 全部重置 (v3) ----------
    ev('rulesV3').cards.forEach(function(c){ c.plans.forEach(function(p){ (p.rewardParts||[]).forEach(function(x){ x.usedReward = 12; }); }); });
    w.resetAllQuotas();
    check('全部重置確認框有開啟', d.getElementById('quotaResetModal').style.display === 'flex');
    w.confirmQuotaReset();
    var anyUsed = ev('rulesV3').cards.some(function(c){ return c.plans.some(function(p){ return (p.rewardParts||[]).some(function(x){ return Number(x.usedReward)>0; }); }); });
    check('全部重置後所有 usedReward 歸零', !anyUsed);

    // ---------- 7. 記帳 → v3Usage → 額度扣減 → 刪除還回 ----------
    d.getElementById('jpyAmount').value = '30000';
    w.calculate();
    var sumUsed = function(){ return ev('rulesV3').cards.reduce(function(s,c){ return s + c.plans.reduce(function(s2,p){ return s2 + (p.rewardParts||[]).reduce(function(s3,x){ return s3 + (Number(x.usedReward)||0); },0); },0); },0); };
    var beforeUsed = sumUsed();
    w.recordExpense();
    await sleep(120);
    confirmDialog();
    await sleep(200);
    var afterUsed = sumUsed();
    check('記帳後 v3 usedReward 增加', afterUsed > beforeUsed, beforeUsed + ' → ' + afterUsed);
    var L = ev('ledger');
    check('記帳寫入 v3Usage 快照', L.length > 0 && !!(L[0].v3Usage) && L[0].ruleSnapshot && L[0].ruleSnapshot.v3 === true, JSON.stringify(L[0] && L[0].ruleSnapshot));
    w.switchTab('ledger');
    check('記帳明細有顯示', d.getElementById('ledgerList').textContent.indexOf('NT$') >= 0);
    var lid = L[0].id;
    w.deleteLedgerItem(lid);
    await sleep(120);
    confirmDialog();
    await sleep(200);
    var backUsed = sumUsed();
    check('刪除紀錄後額度歸還', backUsed <= afterUsed, afterUsed + ' → ' + backUsed);
    check('刪除後 ledger 清空', ev('ledger').length === 0, 'len=' + ev('ledger').length);

    // ---------- 8. 門檻提示 (v3) ----------
    d.getElementById('jpyAmount').value = '1000';
    w.calculate();
    var thrVisible = d.getElementById('thresholdOpportunity').style.display === 'flex';
    var thrText = d.getElementById('thresholdOpportunityText').textContent;
    check('門檻提示為 v3 產生（非寫死卡片）', !thrVisible || /門檻補足機會/.test(thrText), thrVisible ? thrText.slice(0,80) : '(未觸發)');

    w.openAddCard();
    var f = d.getElementById('addDynamicCardForm');
    f.elements.name.value = 'ZZ門檻測試卡';
    f.elements.baseRate.value = '2';
    f.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    await sleep(80);
    check('新增後自動進入該卡編輯頁', d.getElementById('cardEditorOverlay').hidden === false);
    var zcId = ev('(rulesV3.cards.find(function(c){ return c.name === "ZZ門檻測試卡"; }) || {}).id');
    d.getElementById('cardEditorAddActivity').click();
    await sleep(80);
    var af = d.getElementById('addDynamicPlanForm');
    af.elements.namedItem('name').value = 'ZZ門檻加碼';
    af.elements.namedItem('rate').value = '6';
    af.elements.namedItem('cap').value = '5000';
    af.elements.namedItem('threshold').value = '1000';
    af.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    w.closeCardEditor();
    d.getElementById('jpyAmount').value = '1000';
    w.calculate();
    await sleep(80);
    var thrVisible2 = d.getElementById('thresholdOpportunity').style.display === 'flex';
    var thrText2 = d.getElementById('thresholdOpportunityText').textContent;
    check('新卡也會觸發門檻補足機會', thrVisible2 && /ZZ門檻測試卡/.test(thrText2), thrText2.slice(0,110));

    // ---------- 9. 雲端 payload ----------
    var payload = w.makeCloudPayload();
    check('payload 無 cardRules', payload.cardRules === undefined);
    check('payload 無 limits/quotas/quotaPeriods/quotaResetAt', payload.limits === undefined && payload.quotas === undefined && payload.quotaPeriods === undefined && payload.quotaResetAt === undefined);
    check('payload 有 cardRulesV3 + ledger', !!payload.cardRulesV3 && Array.isArray(payload.ledger), 'keys=' + Object.keys(payload).join(','));

    // ---------- 10. 玉山結帳日 → v3 plan ----------
    var esun = w.getEsunKumaCard();
    check('可取得玉山卡 (v3)', !!esun, esun && esun.id);
    d.getElementById('esunStatementDay').value = '18';
    w.saveEsunStatementDay();
    check('結帳日寫入 v3 plan.statementDay', w.getEsunStatementDay() === 18, 'day=' + w.getEsunStatementDay());
    check('帳單週期標籤更新', /每月 18 日結帳/.test(d.getElementById('quotaCards').textContent.replace(/\s+/g,' ')), (d.getElementById('quotaCards').textContent.replace(/\s+/g,' ').match(/每月 18 日結帳[^；]*/)||[''])[0]);

    // ---------- 11. 攻略頁 卡片/表格 切換 ----------
    w.switchTab('guide');
    w.setGuideView('table');
    check('表格模式可切換', d.getElementById('guideTableView').hidden === false && d.getElementById('guideCardView').hidden === true);
    check('表格模式有 v3 資料列', d.querySelectorAll('#guideV3Rows tr').length > 0, d.querySelectorAll('#guideV3Rows tr').length + ' 列');
    w.setGuideView('cards');
    check('卡片模式可切換', d.getElementById('guideCardView').hidden === false && d.getElementById('guideTableView').hidden === true);
    check('攻略總覽有文字', d.getElementById('ruleGuideSummary').textContent.indexOf('張卡片') >= 0, d.getElementById('ruleGuideSummary').textContent.slice(0,50));
    check('新增的卡也出現在攻略頁', d.getElementById('guideCardView').textContent.indexOf('ZZ門檻測試卡') >= 0);

    // ---------- 12. 新卡自動套用通用規則 ----------
    d.getElementById('jpyAmount').value = '10000';
    w.calculate();
    var badge = d.getElementById('rateBadge').textContent;
    check('新卡套用通用規則（2% + 6% - 1.5%）', /6\.5/.test(badge), badge);

    // ---------- 13. 新增卡片的加碼活動直接進 rulesV3 ----------
    var zc = ev('rulesV3').cards.find(function(c){ return c.name === 'ZZ門檻測試卡'; });
    check('新卡在 rulesV3 中', !!zc, zc && zc.id);
    check('新卡的加碼活動在 rulesV3.plan.rewardParts', !!(zc && zc.plans[0].rewardParts.length), JSON.stringify(zc && zc.plans[0].rewardParts.map(function(p){ return {id:p.id, rate:p.rate, cap:p.capAmount, thr:p.thresholdTwd}; })));
    check('新卡沿用通用欄位（baseRate / baseFeeApplies）', !!(zc && zc.baseRate === 2 && zc.baseFeeApplies === true), JSON.stringify({baseRate:zc&&zc.baseRate, fee:zc&&zc.baseFeeApplies}));

    // ---------- 14. 刪除卡片會從 rulesV3 移除 ----------
    w.openCardEditor(zcId);
    await sleep(80);
    d.getElementById('cardEditorDelete').click();
    await sleep(120);
    confirmDialog();
    await sleep(200);
    var stillThere = ev('rulesV3').cards.some(function(c){ return c.name === 'ZZ門檻測試卡'; });
    check('刪除卡片後 rulesV3 不再有該卡', !stillThere);
    check('刪除後單卡編輯頁自動關閉', d.getElementById('cardEditorOverlay').hidden === true);

    check('無 JS 錯誤', errs.length === 0, errs.slice(0,3).join('; '));
  } catch (e) { fail++; log('EXCEPTION: ' + e.message + ' | ' + (e.stack||'').split('\n')[1]); }
  finish();
}, 2600);
</script>
